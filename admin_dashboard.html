<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پنل مدیریت کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=1.0">
    <link rel="stylesheet" href="admin_style.css?v=1.0">
</head>
<body class="loading-active">
    
    <div id="loader" class="admin-loader-custom">
        <div class="loader-content">
            <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--primary-gold);"></i>
            <p class="loading-status" style="color:var(--primary-gold); margin-top:15px;">بارگذاری پنل ادمین...</p>
        </div>
    </div>

    <div id="app-container" class="hidden-content">
        
        <header class="admin-header">
            <h1>⚙️ داشبورد مدیریت کوین باران</h1>
        </header>

        <nav class="admin-nav">
            <a href="/admin" class="nav-button active" data-target="admin-dashboard">
                <i class="fas fa-tachometer-alt"></i> <span>داشبورد</span>
            </a>
            <a href="/admin/kyc" class="nav-button" data-target="admin-reviews">
                <i class="fas fa-clipboard-list"></i> <span>بررسی‌ها</span>
            </a>
            <a href="/admin/users" class="nav-button" data-target="admin-users">
                <i class="fas fa-users"></i> <span>کاربران</span>
            </a>
            <a href="/admin/settings" class="nav-button" data-target="admin-settings">
                <i class="fas fa-cogs"></i> <span>تنظیمات</span>
            </a>
        </nav>

        <main class="admin-main-content">
            
            <section class="quick-stats-section">
                <div class="section-label" style="border-right-color: var(--primary-gold);">
                    <i class="fas fa-bell"></i> نیازمند بررسی سریع
                </div>

                <div class="quick-stats-grid">
                    <div class="stat-card pending-kyc" data-onclick="list_kyc_lite">
                        <span class="stat-value" id="stat-pending-kyc-lite">--</span>
                        <span class="stat-label">KYC ویدیویی (L2)</span>
                    </div>
                    <div class="stat-card pending-kyc" data-onclick="list_kyc_full">
                        <span class="stat-value" id="stat-pending-kyc-full">--</span>
                        <span class="stat-label">KYC کامل (L3)</span>
                    </div>
                    <div class="stat-card pending-deposit" data-onclick="list_deposits">
                        <span class="stat-value" id="stat-pending-deposit">--</span>
                        <span class="stat-label">واریز دستی</span>
                    </div>
                    <div class="stat-card pending-withdrawal" data-onclick="list_withdrawals">
                        <span class="stat-value" id="stat-pending-withdrawal">--</span>
                        <span class="stat-label">برداشت وجه</span>
                    </div>
                </div>
            </section>
            
            <hr class="admin-divider">

            <section class="general-stats-section">
                <div class="section-label" style="border-right-color: var(--accent-green);">
                    <i class="fas fa-chart-line"></i> عملکرد امروز
                </div>
                <div class="quick-stats-grid">
                     <div class="stat-card total-users" style="grid-column: span 1;">
                        <span class="stat-value" id="stat-new-users">--</span>
                        <span class="stat-label">کاربران جدید</span>
                    </div>
                    <div class="stat-card total-volume" style="grid-column: span 1;">
                        <span class="stat-value" id="stat-total-volume">--</span>
                        <span class="stat-label">حجم کل (تومان)</span>
                    </div>
                </div>
            </section>

            <section style="margin-top: 30px;">
                <div class="section-label" style="border-right-color: var(--accent-blue);">
                    <i class="fas fa-tools"></i> ابزارهای مدیریتی
                </div>
                <div class="quick-stats-grid">
                    <button class="btn-admin-action" style="background: #3B82F6;" onclick="window.location.href='/admin/settings'">
                        <i class="fas fa-cogs"></i> تنظیمات عمومی
                    </button>
                     <button class="btn-admin-action" style="background: #10B981;" onclick="window.location.href='/admin/kyc'">
                        <i class="fas fa-fingerprint"></i> بررسی KYC
                    </button>
                    <button class="btn-admin-action" style="background: #FF007A;" onclick="window.location.href='/admin/users'">
                        <i class="fas fa-user-shield"></i> مدیریت کاربران
                    </button>
                    <button class="btn-admin-action" style="background: #F0B90B;" onclick="window.location.href='/admin/accounting'">
                        <i class="fas fa-calculator"></i> حسابداری و PNL
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
    <script src="admin_script.js"></script>
</body>
</html>
