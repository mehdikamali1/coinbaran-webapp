<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>داشبورد</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loader-msg">در حال دریافت اطلاعات...</p>
    </div>

    <div id="app-container" class="hidden">
        <header class="header">
            <div class="user-info">
                <span class="user-icon">💎</span>
                <h1 id="welcome-name" class="loading">...</h1>
            </div>
            <div id="kyc-status" class="kyc-status loading">
                <span id="kyc-text">...</span>
            </div>
        </header>

        <main>
            <section class="balance-card">
                <div class="balance-row">
                    <span class="balance-label"><i class="fas fa-wallet"></i> موجودی تومانی</span>
                    <h2 id="toman-balance" class="balance-amount loading">...</h2>
                </div>
                <div class="balance-row xp">
                    <span class="balance-label"><i class="fas fa-star"></i> امتیاز (XP)</span>
                    <h2 id="xp-balance" class="balance-amount loading">...</h2>
                </div>
            </section>

            <section class="gamification-section">
                <h3><i class="fas fa-gamepad"></i> بازی‌ها</h3>
                <div class="card-container">
                    <div class="card" onclick="window.location.href='game'" style="cursor: pointer; border: 1px solid gold;">
                        <div class="card-header">
                            <span class="card-title" style="color: gold;">بازی کندل بیت‌کوین 🚀</span>
                        </div>
                        <p class="card-subtitle">ورود به بازی</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            const tg = window.Telegram.WebApp;
            const API_BASE_URL = window.location.origin;
            
            const loader = document.getElementById('loader');
            const loaderMsg = document.getElementById('loader-msg');
            const appContainer = document.getElementById('app-container');

            const els = {
                welcomeName: document.getElementById('welcome-name'),
                tomanBalance: document.getElementById('toman-balance'),
                xpBalance: document.getElementById('xp-balance'),
                kycText: document.getElementById('kyc-text'),
                kycStatus: document.getElementById('kyc-status')
            };

            // 1. شروع برنامه
            window.onload = async function() {
                tg.ready();
                tg.expand();

                // اگر دیتای تلگرام نبود (تست مرورگر)
                if (!tg.initData) {
                    // اگر می‌خواهید در مرورگر تست کنید، این خط را فعال بگذارید
                    // اگر برای محصول نهایی است، می‌توانید این را بردارید
                    console.warn("No Telegram Data. Using Guest Mode for testing.");
                    tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%2C%22first_name%22%3A%22Guest%22%7D&auth_date=1700000000&hash=fake";
                }

                await fetchData();
            };

            async function fetchData() {
                try {
                    // درخواست به سرور
                    const response = await fetch(`${API_BASE_URL}/webapp/get_user_data`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ initData: tg.initData })
                    });

                    // اگر سرور ارور داد (مثلا 500 یا 404)
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`خطای سرور (${response.status}): ${errorText.substring(0, 50)}`);
                    }

                    const userData = await response.json();
                    updateUI(userData);

                } catch (error) {
                    console.error(error);
                    loaderMsg.innerHTML = `<span style="color: #FF4D4D; direction: ltr;">${error.message}</span>`;
                    // دکمه تلاش مجدد
                    const retryBtn = document.createElement('button');
                    retryBtn.innerText = "تلاش مجدد";
                    retryBtn.style = "margin-top:10px; padding:10px; background:gold; border:none; border-radius:5px; cursor:pointer;";
                    retryBtn.onclick = () => location.reload();
                    loader.appendChild(retryBtn);
                }
            }

            function updateUI(data) {
                // پر کردن اطلاعات
                els.welcomeName.textContent = `سلام، ${data.first_name}`;
                els.welcomeName.classList.remove('loading');

                els.tomanBalance.textContent = `${data.toman_balance} تومان`;
                els.tomanBalance.classList.remove('loading');

                els.xpBalance.textContent = `${data.xp_balance} XP`;
                els.xpBalance.classList.remove('loading');

                els.kycText.textContent = data.kyc_status_text;
                els.kycStatus.classList.remove('loading');
                els.kycStatus.classList.add(data.kyc_status_code);

                // حذف لودر و نمایش صفحه
                loader.style.display = 'none';
                appContainer.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
