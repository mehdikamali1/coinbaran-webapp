<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>داشبورد کوین باران</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>در حال اتصال...</p>
    </div>

    <div id="app-container" class="hidden">
        <header class="header">
            <div class="user-info">
                <span id="user-icon" class="user-icon">💎</span>
                <h1 id="welcome-name" class="loading">...</h1>
            </div>
            <div id="kyc-status" class="kyc-status loading">
                <span id="kyc-text">...</span>
            </div>
        </header>

        <main>
            <section class="balance-card">
                <div class="balance-row">
                    <span class="balance-label"><i class="fas fa-wallet"></i> موجودی تومانی</span>
                    <h2 id="toman-balance" class="balance-amount loading">...</h2>
                </div>
                <div class="balance-row xp">
                    <span class="balance-label"><i class="fas fa-star"></i> امتیاز (XP)</span>
                    <h2 id="xp-balance" class="balance-amount loading">...</h2>
                </div>
            </section>

            <section class="gamification-section">
                <h3><i class="fas fa-gamepad"></i> بازی‌ها</h3>
                <div class="card-container">
                    <div class="card" onclick="window.location.href='game'" style="cursor: pointer; border: 1px solid gold;">
                        <div class="card-header">
                            <span class="card-title" style="color: gold;">بازی کندل بیت‌کوین 🚀</span>
                        </div>
                        <p class="card-subtitle">ورود به بازی</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
