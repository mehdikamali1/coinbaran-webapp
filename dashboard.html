# webapp/dashboard.html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/style.css?v=20.0">
</head>
<body>

    <div id="loader">
        <div class="logo-loader">💎</div>
        <p style="color:#888; font-size:0.8rem">در حال بارگذاری...</p>
    </div>

    <div id="app-container" class="hidden">
        
        <header>
            <div class="user-profile">
                <div class="avatar">👤</div>
                <div class="user-text">
                    <h2 id="welcome-name">...</h2>
                    <span id="kyc-text" class="kyc-badge">...</span>
                </div>
            </div>
            <div style="color: var(--accent-gold); font-size: 1.2rem;">
                <i class="fas fa-bell"></i>
            </div>
        </header>

        <main>
            
            <div class="balance-card">
                <div class="card-row">
                    <div>
                        <div class="card-label">موجودی تومانی</div>
                        <div class="main-balance" id="toman-balance">... <span class="currency">T</span></div>
                    </div>
                    <div style="font-size:2rem; opacity:0.2; color:white">
                        <i class="fas fa-wallet"></i>
                    </div>
                </div>
                <div class="sub-balances">
                    <div class="sub-item">
                        <span class="card-label">دلاری (UUSD)</span>
                        <span class="sub-val color-usd" id="uusd-balance">...</span>
                    </div>
                    <div class="sub-item" style="text-align:left">
                        <span class="card-label">امتیاز</span>
                        <span class="sub-val color-xp" id="xp-balance">...</span>
                    </div>
                </div>
            </div>

            <div class="menu-title">دسترسی سریع</div>

            <div class="menu-grid">
                
                <div class="menu-item item-game" onclick="window.location.href='game'">
                    <div>
                        <div class="menu-text">بازی کندل 🚀</div>
                        <span class="menu-sub">پیش‌بینی کن و دلار ببر!</span>
                    </div>
                    <div class="game-icon">📈</div>
                </div>

                <div class="menu-item item-usdt" onclick="window.location.href='usdt'">
                    <div>
                        <div class="menu-text" style="color:var(--usdt-green)">ترید تتر (USDT)</div>
                        <span class="menu-sub">خرید و فروش اتوماتیک</span>
                    </div>
                    <div class="usdt-icon">₮</div>
                </div>

                <div class="menu-item item-wallet" onclick="window.location.href='wallet'">
                    <i class="fas fa-credit-card menu-icon-font" style="color: var(--accent-green)"></i>
                    <span class="menu-text">کیف پول</span>
                    <span class="menu-sub">واریز / برداشت</span>
                </div>

                <div class="menu-item item-utopia" onclick="window.location.href='utopia'">
                    <img src="images/utopia_logo.png" alt="Utopia" class="menu-icon-img">
                    <span class="menu-text">یوتوپیا</span>
                    <span class="menu-sub">ووچر آنی</span>
                </div>

                <div class="menu-item" onclick="window.location.href='kyc'" style="border-bottom: 2px solid #FF9800;">
                    <i class="fas fa-id-card-clip menu-icon-font" style="color: #FF9800"></i>
                    <span class="menu-text">احراز هویت</span>
                    <span class="menu-sub">تکمیل پروفایل</span>
                </div>

                <div class="menu-item" onclick="window.location.href='live'" style="border-bottom: 2px solid #fff;">
                    <i class="fas fa-futbol menu-icon-font" style="color: #fff"></i>
                    <span class="menu-text">نتایج زنده</span>
                    <span class="menu-sub">پیش‌بینی فوتبال</span>
                </div>

            </div>
        </main>
    </div>
    
    <script src="webapp/script.js?v=20.0"></script>
</body>
</html>
