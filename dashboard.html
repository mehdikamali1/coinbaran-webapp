<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>داشبورد کوین باران</title>
    <!-- آیکون‌ها زودتر لود شوند -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5.1"> <!-- نسخه CSS آپدیت شد -->
</head>
<body>
    <!-- لودر اولیه -->
    <div id="loader">
        <div class="spinner"></div>
        <p>در حال بارگذاری اطلاعات...</p>
    </div>

    <!-- محتوای اصلی اپلیکیشن -->
    <div id="app-container" class="hidden">
        
        <!-- هدر: اطلاعات کاربر و وضعیت KYC -->
        <header class="header">
            <div class="user-info">
                <span id="user-icon" class="user-icon">💎</span>
                <h1 id="welcome-name" class="loading">...</h1>
            </div>
            <div id="kyc-status" class="kyc-status loading">
                <span id="kyc-text">...</span>
                <i id="kyc-icon" class="fas fa-spinner fa-spin"></i>
            </div>
        </header>

        <main>
            <!-- کارت اصلی موجودی -->
            <section class="balance-card">
                <div class="balance-row">
                    <!-- آیکون کیف پول -->
                    <span class="balance-label"><i class="fas fa-wallet"></i> موجودی تومانی</span>
                    <h2 id="toman-balance" class="balance-amount loading">...</h2>
                </div>
                <div class="balance-row xp">
                    <!-- آیکون ستاره -->
                    <span class="balance-label"><i class="fas fa-star"></i> امتیاز شما (XP)</span>
                    <h2 id="xp-balance" class="balance-amount loading">...</h2>
                </div>
            </section>

            <!-- کارت سطح کاربری و نوار پیشرفت -->
            <section class="level-card">
                <div class="level-header">
                    <span id="level-name" class="loading">...</span>
                    <span>(سطح کاربری)</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                </div>
                <small id="progress-text" class="progress-text loading">...</small>
            </section>

            <!-- ✨✨✨ بخش جدید: دکمه ورود به بازی ✨✨✨ -->
            <section class="gamification-section">
                <h3><i class="fas fa-gamepad"></i> بازی‌های ویژه</h3>
                <div class="card-container">
                    <!-- با کلیک روی این کارت، کاربر به صفحه game.html می‌رود -->
                    <div class="card" onclick="window.location.href='game.html'" style="cursor: pointer; border: 1px solid var(--gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);">
                        <div class="card-header" style="border-bottom: none; padding-bottom: 0;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="card-title" style="color: var(--gold); font-size: 1.2rem;">بازی کندل بیت‌کوین 🚀</span>
                                <span class="live-badge" style="background: rgba(255,215,0,0.2); color: var(--gold); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;">NEW</span>
                            </div>
                        </div>
                        <p class="card-subtitle" style="margin-top: 8px;">پیش‌بینی کن، ۱ دقیقه صبر کن، سود دلاری ببر!</p>
                        <div style="margin-top: 12px; text-align: left;">
                            <span style="color: var(--primary-blue); font-size: 0.9rem; font-weight: bold;">
                                ورود به بازی <i class="fas fa-chevron-left" style="font-size: 0.8rem;"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </section>
            <!-- ✨✨✨ پایان بخش جدید ✨✨✨ -->

            <!-- بخش لیدربرد -->
            <section id="leaderboard-section" class="gamification-section hidden">
                <h3><i class="fas fa-trophy"></i> نفرات برتر پیش‌بینی</h3>
                <div id="leaderboard-container" class="leaderboard-container">
                    <!-- ردیف‌ها توسط جاوااسکریپت اضافه می‌شوند -->
                </div>
            </section>

            <!-- بخش پیش‌بینی‌ها -->
            <section id="predictions-section" class="gamification-section hidden">
                <h3><i class="fas fa-futbol"></i> بازی‌های پیش‌بینی فعال</h3>
                <div id="predictions-container" class="card-container">
                    <!-- کارت‌ها توسط جاوااسکریپت اضافه می‌شوند -->
                </div>
            </section>

            <!-- بخش کمپین‌ها -->
            <section id="campaigns-section" class="gamification-section hidden">
                <h3><i class="fas fa-percent"></i> تخفیف‌های ویژه فعال</h3>
                <div id="campaigns-container" class="card-container">
                    <!-- کارت‌ها توسط جاوااسکریپت اضافه می‌شوند -->
                </div>
            </section>
            
        </main>
        
    </div> <!-- /#app-container -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js?v=2.4"></script> <!-- نسخه JS آپدیت شد -->
</body>
</html>
