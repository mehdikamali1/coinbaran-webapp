#game.html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#171B26">
    <title>Coin Baran | Pro Trading</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="webapp/game-style.css?v=25.0">
</head>
<body>

    <div id="app-container">
        
        <header class="game-header">
            <div class="header-left">
                <button onclick="window.location.href='/'" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            
            <div class="header-center">
                <span class="pair-name">BTC/USDT</span>
                <div class="live-indicator">
                    <span class="blink-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
            </div>

            <div class="header-right">
                <button onclick="window.openLeaderboard()" class="icon-btn trophy-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                </button>
            </div>
        </header>

        <div class="market-stats">
            <div class="price-container">
                <h1 id="btc-price" class="main-price">00,000.00</h1>
                <span class="price-label">شاخص کل (Index Price)</span>
            </div>
            
            <div class="timer-container">
                <div class="timer-wrapper">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="timer-text-box">
                        <span id="timer-text">--</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <div id="tv-chart-container" class="chart-box"></div>
            <div id="chart-loader" class="chart-loader">
                <div class="spinner-gold"></div>
            </div>
        </div>

        <div class="history-section">
            <div id="history-container" class="history-scroll">
                </div>
        </div>

        <div class="spacer-bottom"></div>

        <footer class="trading-controls">
            
            <div class="round-status-bar">
                <span id="round-id" class="round-id">Round #...</span>
                <span id="round-status" class="round-state">Connecting...</span>
            </div>

            <div class="amount-area">
                <div class="quick-chips">
                    <button class="chip" onclick="window.setAmount(1)">1</button>
                    <button class="chip active" onclick="window.setAmount(5)">5</button>
                    <button class="chip" onclick="window.setAmount(10)">10</button>
                    <button class="chip" onclick="window.setAmount(50)">50</button>
                    <button class="chip" onclick="window.setAmount(100)">100</button>
                </div>
                
                <div class="input-wrapper">
                    <span class="currency-prefix">$</span>
                    <input type="number" id="bet-amount" value="5" min="1" inputmode="decimal">
                </div>
            </div>

            <div class="action-buttons">
                <button id="btn-up" class="trade-btn btn-long" onclick="window.placeBet('UP')">
                    <span class="btn-title">LONG</span>
                    <span class="btn-subtitle">خرید صعودی</span>
                </button>
                
                <button id="btn-down" class="trade-btn btn-short" onclick="window.placeBet('DOWN')">
                    <span class="btn-title">SHORT</span>
                    <span class="btn-subtitle">فروش نزولی</span>
                </button>
            </div>
        </footer>

    </div>

    <div id="history-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>تاریخچه معاملات</h3>
                <button onclick="window.closeHistory()" class="close-modal">✕</button>
            </div>
            <div id="history-list" class="modal-body"></div>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 class="gold-text">🏆 برترین معامله‌گران</h3>
                <button onclick="window.closeLeaderboard()" class="close-modal">✕</button>
            </div>
            <div id="leaderboard-list" class="modal-body">در حال بارگذاری...</div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="webapp/game.js?v=25.0"></script>
</body>
</html>
