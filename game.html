#game.html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بازی کندل</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="webapp/style.css?v=20.0">
</head>
<body>

    <div id="app-container">
        
        <div style="padding: 15px 20px; background: var(--bg-color); z-index: 10;">
            <div class="game-header">
                <div style="display:flex; gap:10px; align-items:center">
                    <button onclick="window.location.href='/'" class="back-btn">
                        🏠
                    </button>
                    <button onclick="window.openLeaderboard()" class="trophy-btn">
                        🏆
                    </button>
                </div>
                <div class="live-badge">● LIVE</div>
            </div>
        </div>

        <main style="padding: 0 20px;">
            
            <div class="price-display">
                <div class="price-label">BTC/USDT</div>
                <div id="btc-price">...</div>
            </div>

            <div class="timer-circle">
                <svg class="circular-chart" viewBox="0 0 36 36">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="timer-path" class="circle" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" style="stroke: var(--accent-green);" />
                </svg>
                <div id="timer-text" class="timer-text">--</div>
            </div>

            <div class="chart-container">
                <canvas id="btcChart"></canvas>
            </div>

            <div id="history-container" style="margin-bottom: 20px;"></div>

            <div style="height: 220px;"></div>

        </main>

        <div class="bet-controls">
            <div id="round-status" style="text-align: center; color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">
                در حال اتصال...
            </div>
            
            <div class="quick-amounts">
                <button onclick="window.setAmount(1)" class="chip active">$1</button>
                <button onclick="window.setAmount(5)" class="chip">$5</button>
                <button onclick="window.setAmount(10)" class="chip">$10</button>
                <button onclick="window.setAmount(25)" class="chip">$25</button>
            </div>

            <div class="amount-selector">
                <span>مبلغ شرط (UUSD):</span>
                <input type="number" id="bet-amount" value="1" min="1">
            </div>

            <div class="action-buttons-game">
                <button id="btn-up" class="game-btn btn-up" onclick="window.placeBet('UP')">
                    خرید 📈
                </button>
                <button id="btn-down" class="game-btn btn-down" onclick="window.placeBet('DOWN')">
                    فروش 📉
                </button>
            </div>

            <div class="history-trigger" onclick="window.openHistory()" style="text-align:center; margin-top:15px; color:var(--text-muted); font-size:0.8rem; cursor:pointer;">
                📜 تاریخچه شرط‌های من
            </div>
        </div>

    </div>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; color:white;">تاریخچه بازی‌ها</h3>
                <button onclick="window.closeHistory()" style="background:none; border:none; color:white; font-size:1.5rem;">✕</button>
            </div>
            <div id="history-list" style="max-height: 400px; overflow-y: auto;">
                <div style="text-align:center; padding:20px; color:#888">در حال بارگذاری...</div>
            </div>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content glass-panel">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; color:var(--accent-gold);">🏆 تالار برترین‌ها</h3>
                <button onclick="window.closeLeaderboard()" style="background:none; border:none; color:white; font-size:1.5rem;">✕</button>
            </div>
            
            <div class="stats-card" style="display:flex; justify-content:space-around; background:#222; padding:15px; border-radius:12px; margin-bottom:20px;">
                <div class="stat-item" style="text-align:center;">
                    <span class="stat-label" style="display:block; font-size:0.7rem; color:#888;">بازی‌ها</span>
                    <span class="stat-value" id="my-total-games" style="color:white; font-weight:bold;">--</span>
                </div>
                <div class="stat-item" style="text-align:center;">
                    <span class="stat-label" style="display:block; font-size:0.7rem; color:#888;">بردها</span>
                    <span class="stat-value text-up" id="my-total-wins" style="color:var(--accent-green); font-weight:bold;">--</span>
                </div>
                <div class="stat-item" style="text-align:center;">
                    <span class="stat-label" style="display:block; font-size:0.7rem; color:#888;">نرخ برد</span>
                    <span class="stat-value text-gold" id="my-win-rate" style="color:var(--accent-gold); font-weight:bold;">--%</span>
                </div>
            </div>

            <div class="leaderboard-title" style="margin-bottom:10px; font-size:0.9rem; color:#aaa;">نفرات برتر (۲۴ ساعت)</div>
            <div id="leaderboard-list" class="leaderboard-list" style="max-height: 300px; overflow-y: auto;">
                <div class="loading-spinner" style="text-align:center; color:#888;">در حال دریافت...</div>
            </div>
        </div>
    </div>

    <script src="webapp/game.js?v=20.0"></script>
</body>
</html>
