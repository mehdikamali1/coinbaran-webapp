<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CoinBaran Challenge</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { background-color: #1a202c; color: white; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .game-header { display: flex; justify-content: space-between; padding: 15px; background: #2d3748; align-items: center; }
        .back-btn { background: none; border: none; color: #a0aec0; font-size: 16px; cursor: pointer; }
        .live-badge { background: #e53e3e; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .chart-wrapper { margin: 10px; background: rgba(0,0,0,0.3); border: 1px solid #4a5568; border-radius: 10px; height: 280px; position: relative; }
        #btcChart { width: 100%; height: 100%; }
        
        .price-display { text-align: center; margin: 10px 0; }
        #btc-price { font-size: 32px; font-weight: bold; direction: ltr; color: #63b3ed; margin: 5px 0; text-shadow: 0 0 10px rgba(99, 179, 237, 0.5); }
        
        .round-info { display: flex; justify-content: space-around; padding: 10px; background: rgba(255,255,255,0.05); margin: 10px; border-radius: 8px; }
        #timer-display { font-size: 24px; font-weight: bold; color: #ecc94b; }
        
        .bet-controls { display: flex; flex-direction: column; gap: 10px; padding: 15px; }
        .action-buttons-game { display: flex; gap: 10px; }
        .game-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; }
        .btn-up { background: #48bb78; box-shadow: 0 4px 0 #2f855a; }
        .btn-down { background: #f56565; box-shadow: 0 4px 0 #c53030; }
        .btn-up:active, .btn-down:active { transform: translateY(4px); box-shadow: none; }
        .btn-up:disabled, .btn-down:disabled { opacity: 0.5; transform: none; box-shadow: none; }
        .amount-input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #4a5568; background: #2d3748; color: white; text-align: center; font-size: 20px; box-sizing: border-box; }
        
        #connection-mode { position: fixed; bottom: 5px; left: 5px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="game-header">
        <button onclick="window.location.href='dashboard.html'" class="back-btn">Exit</button>
        <div class="live-badge"><span class="blink">●</span> LIVE</div>
    </div>

    <div class="price-display">
        <div style="font-size:12px;color:#a0aec0;">BITCOIN PRICE (USD)</div>
        <div id="btc-price">Loading...</div>
    </div>

    <div class="round-info">
        <div>
            <div style="font-size:10px;color:#a0aec0;">TIME LEFT</div>
            <div id="timer-display">--</div>
        </div>
        <div>
            <div style="font-size:10px;color:#a0aec0;">STATUS</div>
            <div id="round-status">Syncing...</div>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="btcChart"></div>
    </div>

    <div class="bet-controls">
        <div style="text-align:center;font-size:12px;color:#a0aec0;margin-bottom:5px;">BET AMOUNT (UUSD)</div>
        <input type="number" id="bet-amount" class="amount-input" value="1">
        <div class="action-buttons-game">
            <button id="btn-up" class="game-btn btn-up" onclick="placeBet('UP')">↑ LONG (UP)</button>
            <button id="btn-down" class="game-btn btn-down" onclick="placeBet('DOWN')">↓ SHORT (DOWN)</button>
        </div>
    </div>

    <div id="connection-mode">Mode: Init</div>

    <script>
        const BASE_DOMAIN = "played-amount-governments-lane.trycloudflare.com"; 
        const API_BASE_URL = "https://" + BASE_DOMAIN;
        
        const tg = window.Telegram.WebApp;
        let chart = null;
        let series = null;
        let lastChartUpdate = 0;
        let pollingInterval = null;

        // شروع برنامه
        document.addEventListener("DOMContentLoaded", () => {
            try { tg.ready(); tg.expand(); } catch(e){}
            initChart();
            
            // 1. دریافت اولیه دیتا
            fetchData(true);

            // 2. فعال کردن سیستم "ضد قطعی" (HTTP Polling)
            // این خط باعث می‌شود حتی اگر سوکت نباشد، بازی هر 1 ثانیه آپدیت شود
            pollingInterval = setInterval(() => fetchData(false), 1000);
        });

        function initChart() {
            const container = document.getElementById('btcChart');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#A0AEC0' },
                grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255,255,255,0.1)' } },
                timeScale: { timeVisible: true, secondsVisible: true, borderVisible: false },
                rightPriceScale: { borderVisible: false }
            });
            series = chart.addCandlestickSeries({
                upColor: '#00E096', downColor: '#FF4D4D',
                borderVisible: false, wickUpColor: '#00E096', wickDownColor: '#FF4D4D'
            });
            new ResizeObserver(entries => {
                if (entries.length === 0) return;
                const newRect = entries[0].contentRect;
                chart.applyOptions({ height: newRect.height, width: newRect.width });
            }).observe(container);
        }

        async function fetchData(isFirstLoad) {
            try {
                const r = await fetch(`${API_BASE_URL}/webapp/game/state`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ initData: tg.initData })
                });
                const d = await r.json();

                if (d.status === "success") {
                    document.getElementById('connection-mode').textContent = "Mode: HTTP Sync (Active)";
                    
                    // آپدیت نمودار
                    if (d.chart_history && d.chart_history.length > 0) {
                        const sorted = d.chart_history.sort((a, b) => a.time - b.time);
                        // اگر بار اول است، کل دیتا را بریز
                        if (isFirstLoad || !series) {
                            const uniqueData = [...new Map(sorted.map(item => [item['time'], item])).values()];
                            series.setData(uniqueData);
                        } else {
                            // در دفعات بعد، فقط کندل آخر را آپدیت کن که نمودار پرپر نزند
                            const lastCandle = sorted[sorted.length - 1];
                            series.update(lastCandle);
                        }
                    }
                    updateUI(d);
                }
            } catch (e) {
                console.error(e);
                document.getElementById('connection-mode').textContent = "Mode: Reconnecting...";
            }
        }

        function updateUI(data) {
            if (data.current_price) {
                document.getElementById('btc-price').textContent = `$${data.current_price.toLocaleString()}`;
            }
            
            if (data.round) {
                document.getElementById('timer-display').textContent = data.round.time_left + "s";
                const btnUp = document.getElementById('btn-up');
                const btnDown = document.getElementById('btn-down');
                const status = document.getElementById('round-status');
                
                if (data.round.time_left <= 10) {
                    if(!btnUp.disabled) {
                        btnUp.disabled = true; btnDown.disabled = true;
                        status.textContent = "Closed";
                        status.style.color = "#FFC107";
                    }
                } else {
                    const myBet = localStorage.getItem(`bet_${data.round.id}`);
                    if (myBet) {
                         status.textContent = `Position: ${myBet}`;
                         status.style.color = "#367BFF";
                         btnUp.disabled = true; btnDown.disabled = true;
                    } else {
                        btnUp.disabled = false; btnDown.disabled = false;
                        status.textContent = "Open";
                        status.style.color = "#00E096";
                    }
                }
            }
        }

        window.placeBet = async function(p) {
            const amt = document.getElementById('bet-amount').value;
            try {
                const r = await fetch(`${API_BASE_URL}/webapp/game/bet`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount: parseFloat(amt), prediction: p })
                });
                const res = await r.json();
                if(res.status === 'success') {
                    tg.showAlert("Bet Placed!");
                    // فوراً آپدیت کن
                    fetchData(false).then(() => {
                         // ذخیره لوکال برای نمایش فوری وضعیت
                         // البته fetchData خودش از سرور میگیره ولی این برای اطمینان
                         fetchData(false).then(d => {
                             // مقداردهی در صورت نیاز
                         });
                         // ما باید آیدی راند فعلی رو داشته باشیم، برای سادگی فرض میکنیم آخرین دیتا درسته
                         // چون fetchData صدا زده میشه، UI آپدیت میشه
                    });
                    // یک ترفند برای ذخیره سریع آیدی راند فعلی نداریم چون ریسپانس بت آیدی نمیده
                    // اما مشکلی نیست، رفرش بعدی درستش میکنه
                } else {
                    tg.showAlert(res.message);
                }
            } catch(e) { tg.showAlert("Connection Error"); }
        };
    </script>
</body>
</html>
