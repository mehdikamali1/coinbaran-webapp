<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>چالش بیت‌کوین</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9.0">
    
    <script src="static/lightweight-charts.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        .price-display { margin-top: 15px; text-align: center; }
        .price-label { font-size: 12px; color: #a0aec0; margin-bottom: 5px; }
        #btc-price {
            font-family: sans-serif; font-size: 32px; font-weight: bold;
            color: #ffffff !important; text-shadow: 0 0 15px rgba(54,123,255,0.6);
            margin: 0; direction: ltr;
        }
        /* کانتینر نمودار */
        .chart-wrapper {
            margin: 20px 10px;
            background: rgba(16, 20, 30, 0.6); /* کمی شفاف */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            height: 260px;
            position: relative;
            overflow: hidden; /* جلوگیری از بیرون زدن نمودار */
        }
        #btcChart { width: 100%; height: 100%; }
    </style>
</head>
<body class="game-body">

    <div class="game-header">
        <button onclick="window.location.href='dashboard.html'" class="back-btn">
            <i class="fas fa-arrow-right"></i> خروج
        </button>
        <div class="live-badge"><span class="blink">●</span> MARKET LIVE</div>
    </div>

    <div id="game-container">
        <div class="price-display">
            <div class="price-label">قیمت لحظه‌ای (BTC/USDT)</div>
            <h1 id="btc-price">...</h1>
        </div>

        <div class="timer-circle" style="margin: 15px auto;">
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path id="timer-path" class="circle" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <div id="timer-text" class="timer-text">--</div>
        </div>

        <div class="chart-wrapper">
            <div id="btcChart"></div>
        </div>

        <div id="round-status" class="round-status">در حال اتصال...</div>
        <div id="history-container" class="history-container"></div>

        <div class="bet-controls">
            <div class="amount-selector">
                <span>مبلغ (UUSD):</span>
                <input type="number" id="bet-amount" value="1" min="1" max="100">
            </div>
            <div class="action-buttons-game">
                <button id="btn-up" class="game-btn btn-up" onclick="placeBet('UP')">↑ خرید (LONG)</button>
                <button id="btn-down" class="game-btn btn-down" onclick="placeBet('DOWN')">↓ فروش (SHORT)</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="game.js?v=LOCAL_LIB_99"></script> 
</body>
</html>
