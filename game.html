<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی | کوین باران</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game-style.css">
    
    </head>
<body>
    <div id="app-container" class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="header-item">
                    <span id="round-id" class="round-id">#00000</span>
                    <div id="connection-status" class="connection-status">
                        <span class="status-dot"></span>
                        <span class="status-text">متصل</span>
                    </div>
                </div>
                <div class="header-item">
                    <span class="balance-label">موجودی UUSD:</span>
                    <span id="user-balance-display" class="balance-amount mono-font">0.00</span>
                    <span class="balance-currency">$</span>
                </div>
                <div class="header-item">
                    <button class="action-icon-btn" onclick="window.openSwapModal()">
                        <i class="fas fa-exchange-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="history-ribbon-container">
                <div id="history-container" class="history-ribbon">
                    </div>
            </div>
            
            <div id="tv-chart-container" class="chart-container">
                <div id="chart-loader" class="chart-loader">
                    <div class="spinner"></div>
                    <p>در حال اتصال به انجین بازی...</p>
                </div>
                
                <div class="multiplier-display-wrapper">
                    <span id="btc-price" class="crash-multiplier">1.00</span>
                    <span id="game-status-text" class="status-waiting">آماده‌سازی...</span>
                </div>

                <div class="timer-wrapper">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45" style="stroke-dashoffset: 283;"></circle>
                    </svg>
                    <span id="timer-text" class="timer-text"></span>
                </div>
            </div>
            
            </main>
        <section class="game-controls">...</section>
        <div id="swap-modal" class="modal-overlay" onclick="window.closeSwapModal()">...</div>
        <div id="history-modal" class="modal-overlay" onclick="window.closeHistory()">...</div>
        <div id="leaderboard-modal" class="modal-overlay" onclick="window.closeLeaderboard()">...</div>
        <div id="toast" class="toast hidden">...</div>

    </div>
    
    <script src="game.js"></script>
</body>
</html>
