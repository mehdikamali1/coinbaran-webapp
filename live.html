#live.html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>اتاق بازی زنده</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="color:#888; font-size:0.8rem">در حال اتصال به استادیوم...</p>
    </div>

    <div id="app-container" class="hidden" style="padding: 20px; padding-bottom: 60px;">
        
        <div class="game-header" style="margin-bottom: 20px;">
            <div style="display:flex; gap:10px; align-items:center">
                <button onclick="window.location.href='/'" class="back-btn">
                    🏠 بازگشت
                </button>
            </div>
            <div class="live-badge">● LIVE MATCH</div>
        </div>

        <div style="text-align: center; margin-bottom: 15px;">
            <h2 id="match-title" style="margin: 0; font-size: 1rem; color: white;">...</h2>
            <span id="match-status" style="font-size: 0.8rem; color: var(--accent-gold);">در حال بارگذاری...</span>
        </div>

        <div class="scoreboard-live">
            <div class="team">
                <span id="home-team-name">میزبان</span>
            </div>
            
            <div class="score">
                <span id="live-score">0-0</span>
            </div>
            
            <div class="team">
                <span id="away-team-name">میهمان</span>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0;">

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: 700; color: white;">📊 پیش‌بینی‌های زنده</span>
                <span style="font-size: 0.7rem; color: var(--text-muted);">برای ثبت رای ضربه بزنید</span>
            </div>

            <div id="polls-container">
                <div id="no-polls-message" style="text-align: center; color: var(--text-muted); padding: 30px; background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border);">
                    <i class="fas fa-clipboard-list" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
                    <p style="margin: 0; font-size: 0.9rem;">هنوز سوالی مطرح نشده است.</p>
                    <p style="margin: 5px 0 0 0; font-size: 0.7rem;">منتظر سوالات ادمین باشید...</p>
                </div>
            </div>
        </div>

    </div>

    <div id="connection-status">
        <i class="fas fa-circle-notch fa-spin"></i> در حال برقراری ارتباط...
    </div>

    <script src="live.js"></script>
</body>
</html>
