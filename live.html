<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>اتاق بازی زنده | کوین باران</title>
    
    <!-- Libraries -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Shared Luxury Styles -->
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=71.0">

    <style>
        /* --- Live Stadium Specific Styles --- */
        
        /* نشانگر وضعیت اتصال */
        #connection-status {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 1px solid var(--glass-border);
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.7rem; display: flex; align-items: center; gap: 6px;
            z-index: 90; transition: all 0.3s; opacity: 0; pointer-events: none;
        }
        #connection-status.visible { opacity: 1; top: 80px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        
        /* اسکوربورد اصلی */
        .scoreboard-card {
            background: linear-gradient(180deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.9) 100%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 25px 15px; margin: 10px 0 25px 0;
            position: relative; overflow: hidden;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.8);
        }
        /* افکت نور استادیوم */
        .stadium-light {
            position: absolute; top: -50%; left: 50%; transform: translateX(-50%);
            width: 150px; height: 100px; background: var(--accent-green);
            filter: blur(80px); opacity: 0.15; pointer-events: none;
        }

        .teams-row { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
        
        .team-box { 
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; 
            text-align: center;
        }
        .team-avatar {
            width: 55px; height: 55px; border-radius: 16px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .team-name { font-size: 0.85rem; font-weight: 700; color: #fff; max-width: 80px; line-height: 1.2; }

        .score-box { 
            display: flex; flex-direction: column; align-items: center; 
            width: 100px; 
        }
        .score-display {
            font-family: 'Roboto Mono', monospace; font-size: 2.2rem; font-weight: 800;
            color: var(--primary-gold); text-shadow: 0 0 20px rgba(240, 185, 11, 0.3);
            letter-spacing: 2px;
        }
        .match-timer {
            font-size: 0.75rem; color: var(--accent-green); margin-top: 5px;
            font-family: 'Roboto Mono'; font-weight: 600;
            background: rgba(14, 203, 129, 0.1); padding: 2px 8px; border-radius: 6px;
        }
        .match-timer.blink { animation: pulse-green 1.5s infinite; }

        /* بخش نظرسنجی‌ها */
        .polls-section { margin-top: 20px; }
        .polls-title {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.95rem; font-weight: 700; color: var(--text-main);
            margin-bottom: 15px; border-right: 3px solid var(--accent-blue); padding-right: 10px;
        }

        .poll-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; margin-bottom: 15px;
            animation: slideIn 0.4s ease-out; position: relative; overflow: hidden;
        }
        .poll-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-blue);
        }
        .poll-card.new { border-color: var(--primary-gold); box-shadow: 0 0 15px rgba(240,185,11,0.1); }
        .poll-card.closed { opacity: 0.6; filter: grayscale(1); pointer-events: none; }

        .poll-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;
        }
        .poll-question { font-size: 0.9rem; color: #fff; font-weight: 600; line-height: 1.4; flex: 1; }
        .poll-timer { 
            font-family: 'Roboto Mono'; font-size: 0.8rem; color: var(--primary-gold); 
            background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-right: 10px;
        }

        .poll-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .poll-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 12px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .poll-btn:active { transform: scale(0.96); }
        .poll-btn.selected {
            background: var(--accent-blue); color: #fff; border-color: var(--accent-blue);
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        @keyframes pulse-green { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="grid-overlay"></div>

    <!-- Premium Loader -->
    <div id="loader">
        <div class="loader-content">
            <div class="spinner-premium"></div>
            <div class="brand-text">LIVE MATCH</div>
            <p class="loading-status">Connecting to Stadium...</p>
        </div>
    </div>

    <!-- Connection Status Pill -->
    <div id="connection-status">
        <div class="status-dot"></div>
        <span id="conn-text">Connecting...</span>
    </div>

    <div id="app-container" class="hidden-content" style="padding-bottom: 40px;">
        
        <!-- Header -->
        <header class="glass-header">
            <div class="profile-section">
                <div class="icon-btn ripple-btn" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-right"></i>
                </div>
                <div style="font-weight:800; font-size:1.1rem; color: #fff;">استادیوم زنده</div>
            </div>
            <div class="live-badge" style="background:rgba(246,70,93,0.15); color:var(--accent-red); padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:800; border:1px solid rgba(246,70,93,0.3); display:flex; align-items:center; gap:5px;">
                <div style="width:6px; height:6px; background:var(--accent-red); border-radius:50%; animation:pulse-green 1s infinite;"></div>
                LIVE
            </div>
        </header>

        <div class="main-scroll-area">
            
            <!-- Luxury Scoreboard -->
            <div class="scoreboard-card">
                <div class="stadium-light"></div>
                <div style="text-align:center; margin-bottom:15px; color:var(--text-muted); font-size:0.8rem; letter-spacing:1px;" id="match-title">
                    Loading Match...
                </div>
                
                <div class="teams-row">
                    <div class="team-box">
                        <div class="team-avatar"><i class="fas fa-shield-alt"></i></div>
                        <span id="home-team-name" class="team-name">Home</span>
                    </div>
                    
                    <div class="score-box">
                        <div id="live-score" class="score-display">0-0</div>
                        <div id="match-status" class="match-timer">--:--</div>
                    </div>
                    
                    <div class="team-box">
                        <div class="team-avatar"><i class="fas fa-tshirt"></i></div>
                        <span id="away-team-name" class="team-name">Away</span>
                    </div>
                </div>
            </div>

            <!-- Polls Section -->
            <div class="polls-section">
                <div class="polls-title">
                    <span><i class="fas fa-poll"></i> پیش‌بینی‌های لحظه‌ای</span>
                    <span style="font-size:0.7rem; color:var(--text-muted); font-weight:400;">Real-time Polls</span>
                </div>

                <div id="polls-container">
                    <div id="no-polls-message" style="text-align: center; color: var(--text-muted); padding: 40px; background: rgba(255,255,255,0.02); border-radius: 16px; border: 1px dashed var(--glass-border);">
                        <i class="fas fa-chart-pie" style="font-size: 2.5rem; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p style="margin: 0; font-size: 0.9rem;">هنوز سوالی مطرح نشده است.</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.7rem; opacity:0.6;">منتظر اتفاقات بازی باشید...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script (Logic from old file + UI adaptations) -->
    <script src="webapp/live.js?v=71.0"></script>
</body>
</html>
