<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>اتاق بازی زنده - کوین باران</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* استایل‌های اختصاصی این صفحه */
        body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }
        #app-container { gap: 12px; }

        .live-header {
            text-align: center;
            padding: 10px;
            background-color: var(--secondary-bg-color);
            border-radius: var(--border-radius-md);
        }
        .live-header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: var(--text-color);
        }
        .live-header #match-status {
            font-size: 0.9rem;
            color: var(--color-success);
            font-weight: 700;
        }
        .live-header #match-status.loading {
            color: var(--hint-color);
            font-weight: 400;
        }

        .scoreboard-live {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--secondary-bg-color);
            border-radius: var(--border-radius-md);
            padding: 16px 20px;
            font-weight: 700;
        }
        .scoreboard-live .team {
            font-size: 1.1rem;
        }
        .scoreboard-live .score {
            font-size: 2rem;
            font-weight: 800;
            direction: ltr;
            min-width: 80px;
            text-align: center;
            letter-spacing: 2px;
        }

        #polls-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .poll-card {
            background-color: var(--secondary-bg-color);
            border-radius: var(--border-radius-md);
            padding: 16px;
            transition: all 0.3s ease;
            border: 1px solid var(--secondary-bg-color);
        }
        .poll-card.new {
            border-color: var(--color-xp);
            animation: pulse 1.5s 2;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(251, 192, 45, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0); }
        }
        .poll-card.closed {
            opacity: 0.5;
            background-color: var(--bg-color);
        }
        .poll-card.closed .poll-options {
            pointer-events: none;
        }
        .poll-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .poll-question {
            font-size: 1rem;
            font-weight: 700;
        }
        .poll-timer {
            font-size: 0.9rem;
            color: var(--color-danger);
            font-weight: 700;
        }
        .poll-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
        }
        .poll-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--bg-color);
            padding: 10px;
            border-radius: var(--border-radius-sm);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .poll-btn.selected {
            background-color: var(--color-success);
            color: var(--button-text-color);
            border-color: var(--color-success);
            font-weight: 700;
            pointer-events: none;
        }
        .poll-btn:not(.selected):disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #connection-status {
            font-size: 0.8rem;
            color: var(--hint-color);
            text-align: center;
            padding: 10px;
            background-color: var(--secondary-bg-color);
            border-radius: var(--border-radius-sm);
            margin-top: auto; /* به پایین صفحه می‌چسبد */
        }
        #connection-status.connected {
            color: var(--color-success);
        }
        #connection-status.disconnected {
            color: var(--color-danger);
        }

    </style>
</head>
<body>
    
    <div id="loader">
        <div class="spinner"></div>
        <p>در حال ورود به اتاق بازی...</p>
    </div>

    <div id="app-container" class="hidden">
        <header class="live-header">
            <h1 id="match-title" class="loading">...</h1>
            <span id="match-status" class="loading">...</span>
        </header>

        <section class="scoreboard-live">
            <span id="home-team-name" class="team loading">تیم میزبان</span>
            <span id="live-score" class="score loading">0-0</span>
            <span id="away-team-name" class="team loading">تیم میهمان</span>
        </section>

        <main id="polls-container">
            <div id="no-polls-message" class="card" style="text-align: center; color: var(--hint-color);">
                منتظر نظرسنجی‌های زنده از طرف ادمین باشید...
            </div>
        </main>

        <footer id="connection-status">
            <i class="fas fa-spinner fa-spin"></i> در حال اتصال به سرور...
        </footer>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="live.js?v=1.0"></script>
</body>
</html>
