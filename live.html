<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>استادیوم زنده | کوین باران</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/global.css?v=1.0">
    <link rel="stylesheet" href="webapp/live-style.css?v=1.0">

</head>
<body>

    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="grid-overlay"></div>

    <div id="loader">
        <div class="loader-content">
            <img src="webapp/images/logo-gold.png" alt="CB" class="main-logo-img" style="width:100px; height:100px;">
            <p class="loading-status" style="color:var(--gold-primary); margin-top:15px;">در حال اتصال به استادیوم...</p>
        </div>
    </div>

    <div id="connection-status">
        <div class="status-dot"></div>
        <span id="conn-text">در حال اتصال...</span>
    </div>

    <div id="app-container" class="hidden-content" style="padding-bottom: 40px;">
        
        <header class="glass-header">
            <div class="profile-section">
                <div class="icon-btn ripple-btn" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-right"></i>
                </div>
                <div style="font-weight:800; font-size:1.1rem; color: var(--text-main);">استادیوم زنده</div>
            </div>
            <div class="live-badge" style="background:rgba(246,70,93,0.15); color:var(--accent-red); padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:800; border:1px solid rgba(246,70,93,0.3); display:flex; align-items:center; gap:6px;">
                <div style="width:8px; height:8px; background:var(--accent-red); border-radius:50%; animation:pulse-green 1s infinite;"></div>
                ZINDA
            </div>
        </header>

        <div class="main-scroll-area">
            
            <div class="scoreboard-card">
                <div class="stadium-light"></div>
                <div style="text-align:center; margin-bottom:20px; color:var(--text-muted); font-size:0.85rem; letter-spacing:0.5px;" id="match-title">
                    در حال دریافت اطلاعات بازی...
                </div>
                
                <div class="teams-row">
                    <div class="team-box">
                        <div class="team-avatar"><i class="fas fa-shield-alt"></i></div>
                        <span id="home-team-name" class="team-name">میزبان</span>
                    </div>
                    
                    <div class="score-box">
                        <div id="live-score" class="score-display">0-0</div>
                        <div id="match-status" class="match-timer">--:--</div>
                    </div>
                    
                    <div class="team-box">
                        <div class="team-avatar"><i class="fas fa-tshirt"></i></div>
                        <span id="away-team-name" class="team-name">میهمان</span>
                    </div>
                </div>
            </div>

            <div class="polls-section">
                <div class="polls-title">
                    <span><i class="fas fa-chart-pie"></i> پیش‌بینی‌های لحظه‌ای</span>
                    <span style="font-size:0.75rem; color:var(--text-muted); font-weight:400;">(Live Polls)</span>
                </div>

                <div id="polls-container">
                    <div id="no-polls-message" style="text-align: center; color: var(--text-muted); padding: 50px 20px; background: rgba(255,255,255,0.02); border-radius: 16px; border: 1px dashed var(--glass-border);">
                        <i class="fas fa-clipboard-list" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p style="margin: 0; font-size: 0.95rem; font-weight:bold;">هنوز سوالی مطرح نشده است.</p>
                        <p style="margin: 8px 0 0 0; font-size: 0.75rem; opacity:0.6;">منتظر اتفاقات بازی باشید...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="webapp/live.js?v=74.0"></script>
    
    <script>
        // لودر به صورت دستی توسط live.js مخفی می‌شود وقتی سوکت متصل شد
        // اما برای اطمینان یک تایم‌اوت طولانی می‌گذاریم
        setTimeout(() => {
            const l = document.getElementById('loader');
            if(l && l.style.display !== 'none') {
                // اگر بعد از ۱۰ ثانیه هنوز وصل نشد، لودر را بردار تا کاربر صفحه را ببیند
                l.style.opacity='0'; 
                setTimeout(()=> {
                    l.style.display='none'; 
                    document.getElementById('app-container').classList.remove('hidden-content');
                    document.getElementById('app-container').classList.add('fade-in-active');
                }, 500); 
            }
        }, 10000);
    </script>
</body>
</html>
