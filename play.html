<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بازی کندل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');
        :root { --bg: #0F0F1A; --card: #1C1C2E; --text: #FFF; --green: #00E096; --red: #FF4D4D; --gold: #FFD700; }
        
        body { margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .game-header { display: flex; justify-content: space-between; padding: 15px; background: var(--card); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .back-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; }
        .live { color: var(--red); font-weight: bold; animation: blink 1.5s infinite; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        #game-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }
        
        .price-label { color: #888; font-size: 0.9rem; margin-bottom: 5px; }
        #btc-price { font-size: 2.8rem; font-weight: 800; margin: 0; font-family: monospace; color: white; transition: color 0.3s; letter-spacing: -1px; }
        .up { color: var(--green) !important; }
        .down { color: var(--red) !important; }

        .timer-wrapper { margin: 20px 0; position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
        .timer-circle { width: 100%; height: 100%; border: 5px solid #333; border-radius: 50%; position: absolute; top: 0; left: 0; }
        #timer { font-size: 1.8rem; font-weight: bold; z-index: 2; }
        
        .chart-box { width: 100%; height: 220px; background: rgba(255,255,255,0.03); border-radius: 16px; padding: 10px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05); }
        
        .controls { width: 100%; background: var(--card); padding: 20px; border-radius: 20px; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-row { display: flex; gap: 12px; margin-top: 15px; }
        .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.96); }
        .btn-up { background: var(--green); box-shadow: 0 4px 12px rgba(0, 224, 150, 0.2); }
        .btn-down { background: var(--red); box-shadow: 0 4px 12px rgba(255, 77, 77, 0.2); }
        .btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; padding: 8px; width: 100px; text-align: center; font-size: 1.2rem; font-weight: bold; font-family: monospace; }
        
        #status { text-align: center; margin-bottom: 15px; color: #888; font-size: 0.9rem; min-height: 20px; }
        
        /* History Bubbles */
        #history { display: flex; justify-content: center; gap: 5px; margin-top: 20px; flex-wrap: wrap; }
        .bubble { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .bubble.UP { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .bubble.DOWN { background: var(--red); box-shadow: 0 0 5px var(--red); }
    </style>
</head>
<body>

    <div class="game-header">
        <button onclick="window.location.href='/'" class="back-btn">بازگشت</button>
        <div class="live">● LIVE</div>
    </div>

    <div id="game-container">
        <div class="price-label">BTC/USDT</div>
        <div id="btc-price">...</div>

        <div class="timer-wrapper">
            <div class="timer-circle"></div>
            <div id="timer">--</div>
        </div>

        <div class="chart-box">
            <canvas id="chart"></canvas>
        </div>

        <div id="history"></div>

        <div class="controls">
            <div id="status">در حال اتصال...</div>
            
            <div class="input-group">
                <span style="font-size: 0.9rem; color: #aaa;">مبلغ (UUSD):</span>
                <input type="number" id="amount" value="1" min="1">
            </div>

            <div class="btn-row">
                <button id="btn-up" class="btn btn-up" onclick="bet('UP')">خرید 📈</button>
                <button id="btn-down" class="btn btn-down" onclick="bet('DOWN')">فروش 📉</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API = window.location.origin;
        
        let chartInstance;
        let prices = [];
        const MAX_POINTS = 40;

        // --- سیستم صوتی ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        // فعال‌سازی صدا با لمس
        ['click', 'touchstart'].forEach(evt => 
            document.body.addEventListener(evt, () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true })
        );

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'win') {
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(1046, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.stop(now + 0.3);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.stop(now + 0.3);
            } else { // click
                osc.frequency.value = 800;
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.stop(now + 0.1);
            }
            osc.start(now);
        }

        window.onload = function() {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#1C1C2E');
            
            // اگر در مرورگر تست می‌کنید (حالت مهمان)
            if(!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1&hash=x";
            
            initChart();
            setInterval(updateGame, 1000);
        };

        function initChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(54, 123, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(54, 123, 255, 0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: Array(MAX_POINTS).fill(''), datasets: [{ data: [], borderColor: '#367BFF', backgroundColor: gradient, borderWidth: 2, pointRadius: 0, fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false }, scales: { x: { display: false }, y: { display: true, position: 'right', grid: { color: '#333' } } }, animation: false }
            });
        }

        async function updateGame() {
            try {
                const res = await fetch(`${API}/webapp/game/state`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                if(res.ok) render(await res.json());
            } catch(e) { console.log(e); }
        }

        function render(data) {
            // قیمت
            const elPrice = document.getElementById('btc-price');
            const oldPrice = parseFloat(elPrice.innerText.replace(/[^0-9.]/g, '')) || 0;
            elPrice.innerText = `$${data.current_price.toLocaleString()}`;
            elPrice.className = data.current_price >= oldPrice ? 'up' : 'down';

            // چارت
            prices.push(data.current_price);
            if(prices.length > MAX_POINTS) prices.shift();
            chartInstance.data.datasets[0].data = prices;
            chartInstance.update();

            // وضعیت راند
            const status = document.getElementById('status');
            const timerCircle = document.querySelector('.timer-circle');
            
            if(data.round) {
                document.getElementById('timer').innerText = data.round.time_left;
                
                if(data.round.time_left <= 10) {
                    status.innerText = "⏳ بسته شد (منتظر نتیجه)";
                    status.style.color = "#FFD700";
                    timerCircle.style.borderColor = "#FFD700";
                    toggleBtns(true);
                } else {
                    status.innerText = "🟢 شرط بندی باز است";
                    status.style.color = "#00E096";
                    timerCircle.style.borderColor = "#333";
                    if(!data.user_bet) toggleBtns(false);
                }
            }

            if(data.user_bet) {
                status.innerText = `پوزیشن شما: ${data.user_bet.prediction === 'UP' ? 'خرید 📈' : 'فروش 📉'}`;
                toggleBtns(true);
            }
            
            // تاریخچه
            if (data.history) {
               const histBox = document.getElementById('history');
               histBox.innerHTML = '';
               data.history.slice(0, 15).forEach(h => {
                   const b = document.createElement('div');
                   b.className = `bubble ${h.result}`;
                   histBox.appendChild(b);
               });

               // برد و باخت
               if(data.history.length > 0) {
                   const last = data.history[0];
                   const myBetKey = 'bet_' + last.round_id;
                   const myBet = localStorage.getItem(myBetKey);
                   
                   if (myBet) {
                       localStorage.removeItem(myBetKey);
                       if (myBet === last.result) {
                           playSound('win');
                           tg.showAlert(`🎉 تبریک! برنده شدید.`);
                           confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                       } else {
                           playSound('lose');
                           tg.showAlert(`❌ متاسفانه باختید.`);
                       }
                   }
               }
            }
        }

        window.bet = async function(type) {
            playSound('click');
            const amt = document.getElementById('amount').value;
            if(!amt || amt < 1) return alert("مبلغ نامعتبر");

            toggleBtns(true); // قفل موقت دکمه‌ها
            
            try {
                const res = await fetch(`${API}/webapp/game/bet`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount: parseFloat(amt), prediction: type })
                });
                const result = await res.json();
                
                if(result.status === "success") {
                    tg.HapticFeedback.notificationOccurred('success');
                    // ذخیره موقت آیدی راند برای چک کردن نتیجه (با فرض اینکه راند فعلی در دیتای بعدی میاد)
                    // در اینجا چون دسترسی مستقیم به آیدی راند در لحظه کلیک نداریم، منتظر آپدیت بعدی می‌مانیم
                    // اما برای اطمینان، کلاینت‌ساید ذخیره می‌کنیم:
                    fetch(`${API}/webapp/game/state`, { // یک درخواست سریع برای گرفتن آیدی راند
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ initData: tg.initData })
                    }).then(r=>r.json()).then(d => {
                        if(d.round) localStorage.setItem('bet_' + d.round.id, type);
                    });
                    
                    alert("✅ شرط ثبت شد!");
                } else {
                    alert(result.message);
                    toggleBtns(false); // باز کردن قفل در صورت خطا
                }
            } catch(e) { 
                alert("خطا در اتصال"); 
                toggleBtns(false);
            }
        }

        function toggleBtns(disable) {
            document.getElementById('btn-up').disabled = disable;
            document.getElementById('btn-down').disabled = disable;
        }
    </script>
</body>
</html>
