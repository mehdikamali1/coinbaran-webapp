<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بازی کندل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');
        :root { --bg: #0F0F1A; --card: #1C1C2E; --text: #FFF; --green: #00E096; --red: #FF4D4D; --gold: #FFD700; }
        body { margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        
        .game-header { display: flex; justify-content: space-between; padding: 15px; background: var(--card); }
        .back-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 5px 10px; border-radius: 5px; }
        .live { color: var(--red); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #game-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* المان‌های کلیدی با ID دقیق */
        #btc-price { font-size: 2.5rem; font-weight: 800; margin: 10px 0; font-family: monospace; color: white; transition: color 0.3s; }
        .up { color: var(--green) !important; }
        .down { color: var(--red) !important; }

        .timer-circle { width: 80px; height: 80px; margin: 10px; position: relative; display: flex; align-items: center; justify-content: center; border: 4px solid #333; border-radius: 50%; font-size: 1.5rem; font-weight: bold; }
        
        .chart-box { width: 100%; height: 200px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 5px; margin: 15px 0; }
        
        .controls { width: 100%; background: var(--card); padding: 15px; border-radius: 15px; margin-top: auto; margin-bottom: 60px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-up { background: var(--green); }
        .btn-down { background: var(--red); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        input { width: 100%; padding: 10px; background: #333; border: none; color: white; border-radius: 5px; text-align: center; font-size: 1.2rem; }
        
        #status { text-align: center; margin-bottom: 10px; color: #888; }

        /* دیباگر */
        #debugger {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
            background: rgba(0,0,0,0.9); color: lime; font-family: monospace; font-size: 10px;
            overflow-y: scroll; padding: 5px; z-index: 10000; border-top: 1px solid red;
            direction: ltr; text-align: left;
        }
    </style>
</head>
<body>

    <div id="debugger">Initializing...<br></div>

    <div class="game-header">
        <button onclick="window.location.href='/'" class="back-btn">خروج</button>
        <div class="live">● LIVE</div>
    </div>

    <div id="game-container">
        <div style="text-align: center; color: #888;">BTC/USDT</div>
        <div id="btc-price">...</div>

        <div class="timer-circle" id="timer">--</div>

        <div class="chart-box">
            <canvas id="chart"></canvas>
        </div>

        <div class="controls">
            <div id="status">در حال اتصال...</div>
            
            <input type="number" id="amount" value="1">
            
            <div class="btn-row">
                <button id="btn-up" class="btn btn-up" onclick="bet('UP')">خرید 📈</button>
                <button id="btn-down" class="btn btn-down" onclick="bet('DOWN')">فروش 📉</button>
            </div>
        </div>
    </div>

    <script>
        const debugBox = document.getElementById('debugger');
        function log(msg) {
            debugBox.innerHTML += `> ${msg}<br>`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }
        function error(msg) {
            debugBox.innerHTML += `<span style="color:red">ERR: ${msg}</span><br>`;
        }

        const tg = window.Telegram.WebApp;
        const API = window.location.origin;
        let chartInstance;
        let prices = [];

        // --- Sound ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'win') {
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1046, audioCtx.currentTime + 0.2);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.3);
            } else { osc.frequency.value = 800; }
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        window.onload = function() {
            log("Page Loaded.");
            tg.ready(); tg.expand();
            if(!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1&hash=x";
            initChart();
            setInterval(updateGame, 1000);
        };

        function initChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: Array(30).fill(''), datasets: [{ data: [], borderColor: '#367BFF', borderWidth: 2, pointRadius: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false }, scales: { x: { display: false }, y: { display: true, position: 'right' } }, animation: false }
            });
        }

        async function updateGame() {
            try {
                const res = await fetch(`${API}/webapp/game/state`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                if(res.ok) render(await res.json());
            } catch(e) { error(e.message); }
        }

        function render(data) {
            // 1. Price Update
            const elPrice = document.getElementById('btc-price');
            if(elPrice) {
                const oldPrice = parseFloat(elPrice.innerText.replace(/[^0-9.]/g, '')) || 0;
                elPrice.innerText = `$${data.current_price.toLocaleString()}`;
                elPrice.className = data.current_price >= oldPrice ? 'up' : 'down';
            } else error("Element 'btc-price' missing!");

            // 2. Chart Update
            prices.push(data.current_price);
            if(prices.length > 30) prices.shift();
            chartInstance.data.datasets[0].data = prices;
            chartInstance.update();

            // 3. Timer & Status
            const elTimer = document.getElementById('timer');
            const elStatus = document.getElementById('status');
            
            if(data.round) {
                if(elTimer) elTimer.innerText = data.round.time_left;
                
                if(data.round.time_left <= 10) {
                    if(elStatus) elStatus.innerText = "⏳ بسته شد";
                    toggleBtns(true);
                } else {
                    if(elStatus) elStatus.innerText = "🟢 باز";
                    if(!data.user_bet) toggleBtns(false);
                }
            } else {
                if(elTimer) elTimer.innerText = "--";
                if(elStatus) elStatus.innerText = "انتظار...";
            }

            if(data.user_bet && elStatus) {
                elStatus.innerText = `پوزیشن: ${data.user_bet.prediction}`;
                toggleBtns(true);
            }
            
            // 4. Win/Loss Check
            if (data.history && data.history.length > 0) {
               const last = data.history[0];
               const myBet = localStorage.getItem('bet_' + last.round_id);
               if (myBet) {
                   localStorage.removeItem('bet_' + last.round_id);
                   if (myBet === last.result) {
                       playSound('win'); tg.showAlert(`🎉 بردی!`); confetti();
                   } else {
                       playSound('lose'); tg.showAlert(`❌ باختی.`);
                   }
               }
            }
        }

        window.bet = async function(type) {
            playSound('click');
            const amt = document.getElementById('amount').value;
            try {
                const res = await fetch(`${API}/webapp/game/bet`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount: parseFloat(amt), prediction: type })
                });
                const result = await res.json();
                if(result.status === "success") {
                    // ذخیره موقت (چون آیدی راند را در این نسخه ساده نداریم، فرض می‌کنیم راند بعدی نتیجه می‌دهد)
                    // در نسخه کامل باید round_id را از سرور بگیریم
                    // اینجا برای تست فقط الرت می‌دهیم
                    alert("✅ ثبت شد");
                } else {
                    alert(result.message);
                }
            } catch(e) { alert("Error"); }
        }

        function toggleBtns(disable) {
            const u = document.getElementById('btn-up');
            const d = document.getElementById('btn-down');
            if(u) u.disabled = disable;
            if(d) d.disabled = disable;
        }
    </script>
</body>
</html>
