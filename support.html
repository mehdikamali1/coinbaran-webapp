<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Coin Baran | Support VIP</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=95.0">
</head>
<body class="loading-active">

    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="grid-overlay"></div>

    <div id="loader">
        <div class="infinity-container">
            <img src="webapp/images/logo-gold.png" alt="Coin Baran" class="center-logo">
            <svg class="infinity-svg" viewBox="0 0 340 170">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path class="infinity-bg" d="M170,85 C 230,145 310,145 310,85 C 310,25 230,25 170,85 C 110,145 30,145 30,85 C 30,25 110,25 170,85" />
                <path class="infinity-path" d="M170,85 C 230,145 310,145 310,85 C 310,25 230,25 170,85 C 110,145 30,145 30,85 C 30,25 110,25 170,85" />
            </svg>
        </div>
        <div class="loader-text-wrapper">
            <p class="status-msg">CONNECTING TO SECURE LINE...</p>
        </div>
    </div>

    <div id="app-container" class="hidden-content">
        
        <header class="glass-header">
            <div class="profile-section">
                <button class="icon-btn ripple-btn" onclick="window.location.href='dashboard.html'" style="border: none; background: transparent; width: auto; padding-right: 0;">
                    <i class="fas fa-arrow-right" style="font-size: 1.2rem; color: #fff;"></i>
                </button>

                <div class="avatar-frame" style="width: 40px; height: 40px; margin-right: 10px;">
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Support" class="avatar-img">
                    <div class="online-dot"></div>
                </div>

                <div class="user-details">
                    <h2 style="font-size: 0.95rem; margin: 0; color: #fff;">پشتیبانی VIP</h2>
                    <span style="font-size: 0.7rem; color: #0ECB81;">آنلاین | پاسخگویی سریع</span>
                </div>
            </div>
            
            <div class="header-icons">
                <button class="icon-btn ripple-btn" id="chat-options-btn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </header>

        <div class="chat-layout">
            
            <div class="chat-messages-area" id="messages-container">
            </div>

            <div class="chat-input-bar">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                
                <button class="attach-btn ripple-effect" id="attach-btn">
                    <i class="fas fa-paperclip"></i>
                </button>
                
                <input type="text" class="chat-input-field" id="message-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
                
                <button class="send-btn ripple-effect" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

        </div>
    </div>
    
    <script src="webapp/script.js?v=95.0"></script> 
</body>
</html>
