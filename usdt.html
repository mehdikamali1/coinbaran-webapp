<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تبادل تتر | کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=32.0">

    <style>
        :root {
            --color-up: #0ecb81;
            --color-down: #f6465d;
            --gold-primary: #f0b90b;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .main-scroll-area {
            padding: 20px;
            padding-bottom: 150px !important;
        }

        /* --- اصلاح فیلد ورودی برای جلوگیری از محو شدن متن --- */
        .input-box { position: relative; margin-bottom: 20px; }
        .inp-label { display: block; color: #848e9c; font-size: 0.85rem; margin-bottom: 8px; text-align: right; }
        
        .glass-inp {
            width: 100%; 
            background: rgba(255, 255, 255, 0.08) !important; 
            border: 1px solid var(--glass-border);
            color: #ffffff !important; 
            padding: 16px; 
            border-radius: 16px;
            font-size: 1.1rem; 
            font-weight: 700; 
            font-family: 'Roboto Mono', monospace; 
            text-align: left; 
            direction: ltr;
            outline: none;
            box-sizing: border-box;
            -webkit-appearance: none;
        }

        .glass-inp:focus { 
            border-color: var(--gold-primary); 
            background: rgba(255, 255, 255, 0.12) !important; 
            box-shadow: 0 0 15px rgba(240, 185, 11, 0.1);
        }

        select.glass-inp {
            text-align: right;
            direction: rtl;
            padding-right: 16px;
        }

        /* --- کارت نرخ‌ها --- */
        .ticker-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px; 
            margin-bottom: 25px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .ticker-col { display: flex; flex-direction: column; gap: 5px; }
        .ticker-label { font-size: 0.75rem; color: #848e9c; }
        .ticker-val { font-family: 'Roboto Mono'; font-size: 1.2rem; font-weight: 800; }
        .col-buy { color: var(--color-down); } 
        .col-sell { color: var(--color-up); }

        /* --- تب‌ها --- */
        .switch-tabs {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 5px; display: flex; margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1; padding: 12px; text-align: center; border-radius: 12px;
            font-weight: 700; font-size: 0.9rem; color: #848e9c;
            cursor: pointer; transition: all 0.3s;
        }
        .tab-btn.active.buy-mode { background: var(--color-up); color: #000; }
        .tab-btn.active.sell-mode { background: var(--color-down); color: #fff; }

        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

        .calc-row { display: flex; justify-content: space-between; padding: 0 5px; margin-bottom: 20px; }
        .calc-val { font-family: 'Roboto Mono'; font-weight: 700; color: var(--gold-primary); font-size: 1.1rem; }

        .btn-submit {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s; margin-top: 10px;
        }
        .bg-green { background: var(--color-up); color: #000; }
        .bg-red { background: var(--color-down); color: #fff; }

        /* --- مودال وضعیت --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #161a1e; border: 1px solid var(--glass-border); width: 85%;
            border-radius: 24px; padding: 30px 20px; text-align: center;
        }
        
        .invalid { border-color: var(--color-down) !important; }
        .valid { border-color: var(--color-up) !important; }

        .copy-box {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; 
            margin-bottom: 20px; text-align: center; border: 1px dashed var(--glass-border);
        }
    </style>
</head>
<body>

    <header class="glass-header" style="position: sticky; top:0; z-index:100; background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);">
        <div class="profile-section" style="padding: 15px; display: flex; align-items: center;">
            <div class="icon-btn" onclick="window.location.href='/'" style="cursor:pointer; padding: 10px;">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div style="font-weight:800; font-size:1.1rem; margin-right: 10px;">تبادل تتر</div>
        </div>
    </header>

    <div class="main-scroll-area">
        
        <div class="ticker-card">
            <div class="ticker-col">
                <span class="ticker-label">خرید ما از شما</span>
                <span class="ticker-val col-sell" id="rate-buy">---</span>
            </div>
            <div style="width:1px; height:40px; background:var(--glass-border)"></div>
            <div class="ticker-col" style="align-items:flex-end">
                <span class="ticker-label">فروش ما به شما</span>
                <span class="ticker-val col-buy" id="rate-sell">---</span>
            </div>
        </div>

        <div class="switch-tabs">
            <div class="tab-btn active buy-mode" onclick="setMode('buy')">خرید USDT</div>
            <div class="tab-btn" onclick="setMode('sell')">فروش USDT</div>
        </div>

        <div id="buy-form" class="form-section active">
            <div class="input-box">
                <label class="inp-label">مقدار خرید (تتر)</label>
                <input type="number" id="buy-amount" class="glass-inp" placeholder="0.00" oninput="calc('buy')">
            </div>
            <div class="calc-row">
                <span style="font-size:0.8rem; color:#848e9c">مبلغ پرداختی:</span>
                <span class="calc-val" id="buy-total">0 تومان</span>
            </div>

            <div class="input-box">
                <label class="inp-label">شبکه دریافت</label>
                <select id="buy-network" class="glass-inp">
                    <option value="TRC20">TRON (TRC20)</option>
                    <option value="BEP20">BSC (BEP20)</option>
                    <option value="TON">TON Network</option>
                </select>
            </div>

            <div class="input-box">
                <label class="inp-label">آدرس کیف پول شما</label>
                <input type="text" id="buy-address" class="glass-inp" placeholder="آدرس مقصد را وارد کنید">
            </div>

            <button class="btn-submit bg-green" onclick="submitBuy()">
                <i class="fas fa-shopping-cart"></i> ثبت سفارش خرید
            </button>
        </div>

        <div id="sell-form" class="form-section">
            <div class="input-box">
                <label class="inp-label">شبکه واریز تتر</label>
                <select id="sell-network" class="glass-inp" onchange="updateWalletAddress()">
                    <option value="TRC20">TRON (TRC20)</option>
                    <option value="BEP20">BSC (BEP20)</option>
                </select>
            </div>

            <div class="copy-box">
                <span style="font-size:0.75rem; color:#848e9c; display:block; margin-bottom:8px">واریز تتر به آدرس صرافی ما:</span>
                <div id="admin-wallet-address" style="font-family:'Roboto Mono'; color:var(--gold-primary); word-break:break-all; font-size:0.85rem; margin-bottom:12px">...</div>
                <button onclick="copyAddress()" style="background:rgba(240,185,11,0.1); border:1px solid var(--gold-primary); color:var(--gold-primary); padding:10px; border-radius:12px; width:100%; font-weight:bold; cursor:pointer;">
                    <i class="fas fa-copy"></i> کپی آدرس واریز
                </button>
            </div>

            <div class="input-box">
                <label class="inp-label">مقدار خالص ارسالی</label>
                <input type="number" id="sell-amount" class="glass-inp" placeholder="0.00" oninput="calc('sell')">
            </div>
            <div class="calc-row">
                <span style="font-size:0.8rem; color:#848e9c">مبلغی که دریافت می‌کنید:</span>
                <span class="calc-val" id="sell-total">0 تومان</span>
            </div>

            <div class="input-box">
                <label class="inp-label">شناسه تراکنش (TxID)</label>
                <input type="text" id="sell-txid" class="glass-inp" placeholder="هش تراکنش را اینجا وارد کنید">
            </div>

            <button class="btn-submit bg-red" onclick="submitSell()">
                <i class="fas fa-paper-plane"></i> تایید و ثبت فروش
            </button>
        </div>
    </div>

    <div id="status-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-content-area">
                <div id="modal-icon" style="font-size:3.5rem; margin-bottom:15px;">⏳</div>
                <h3 id="modal-title" style="color:#fff; margin:0 0 10px 0;">در حال پردازش</h3>
                <p id="modal-text" style="color:#848e9c; font-size:0.95rem; line-height:1.6;"></p>
            </div>
            <button id="modal-close-btn" onclick="closeModal()" style="display:none; background:var(--gold-primary); border:none; color:#000; padding:14px 40px; border-radius:14px; margin-top:25px; font-weight:900; width:100%;">بستن</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        let WALLETS = {}; 
        let rates = { buy: 0, sell: 0 };

        window.onload = function() {
            tg.ready();
            tg.expand();
            fetchRates();

            const addrInput = document.getElementById('buy-address');
            if(addrInput) {
                addrInput.addEventListener('input', (e) => validateAddress(e.target.value));
            }
        };

        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/usdt/rates?t=${Date.now()}`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'}, 
                    body: JSON.stringify({ initData: tg.initData }) 
                });
                
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; 
                    rates.sell = data.sell;
                    WALLETS = data.wallets;
                    updateWalletAddress();
                    
                    document.getElementById('rate-buy').innerText = rates.buy.toLocaleString();
                    document.getElementById('rate-sell').innerText = rates.sell.toLocaleString();
                } else {
                    throw new Error(data.message || "خطا در دریافت قیمت");
                }
            } catch(e) {
                console.error(e);
                tg.showAlert("⚠️ خطا در دریافت اطلاعات از سرور. لطفاً دوباره تلاش کنید.");
            }
        }

        function setMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'buy-mode', 'sell-mode'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if(mode === 'buy') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active', 'buy-mode');
                document.getElementById('buy-form').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active', 'sell-mode');
                document.getElementById('sell-form').classList.add('active');
            }
            tg.HapticFeedback.impactOccurred('light');
        }

        function validateAddress(addr) {
            addr = addr.trim();
            const netSelect = document.getElementById('buy-network');
            const el = document.getElementById('buy-address');
            el.classList.remove('valid', 'invalid');

            if(addr.length < 8) return;

            if(addr.startsWith('T') && addr.length >= 34) {
                netSelect.value = 'TRC20'; el.classList.add('valid');
            } else if(addr.startsWith('0x') && addr.length >= 42) {
                netSelect.value = 'BEP20'; el.classList.add('valid');
            } else if((addr.startsWith('EQ') || addr.startsWith('UQ')) && addr.length >= 48) {
                netSelect.value = 'TON'; el.classList.add('valid');
            } else {
                el.classList.add('invalid');
            }
        }

        function updateWalletAddress() { 
            const net = document.getElementById('sell-network').value;
            document.getElementById('admin-wallet-address').innerText = WALLETS[net] || "آدرس تنظیم نشده است"; 
        }

        function copyAddress() {
            const txt = document.getElementById('admin-wallet-address').innerText;
            if(txt.includes('...')) return;
            navigator.clipboard.writeText(txt);
            tg.showAlert("✅ آدرس صرافی کپی شد.");
            tg.HapticFeedback.notificationOccurred('success');
        }

        function calc(mode) {
            const val = parseFloat(document.getElementById(mode + '-amount').value) || 0;
            const resEl = document.getElementById(mode + '-total');
            const price = (mode === 'buy') ? rates.sell : rates.buy;
            resEl.innerText = `${Math.floor(val * price).toLocaleString()} تومان`;
        }

        function showStatus(title, text, icon, showClose = false) {
            document.getElementById('status-modal').classList.add('active');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-close-btn').style.display = showClose ? 'block' : 'none';
        }

        function closeModal() {
            document.getElementById('status-modal').classList.remove('active');
            if(document.getElementById('modal-icon').innerText === '✅') location.reload();
        }

        async function submitBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const address = document.getElementById('buy-address').value.trim();
            const network = document.getElementById('buy-network').value;

            if(!amount || amount < 2) { tg.showAlert("❌ حداقل خرید ۲ تتر است."); return; }
            if(!address || address.length < 10) { tg.showAlert("❌ آدرس معتبر نیست."); return; }

            showStatus("در حال ثبت سفارش", "لطفاً از صفحه خارج نشوید...", "⏳");

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/usdt/buy`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                    body: JSON.stringify({ initData: tg.initData, amount, address, network })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    showStatus("موفقیت‌آمیز", "سفارش شما با موفقیت ثبت شد و به زودی واریز می‌گردد.", "✅", true);
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    showStatus("خطا در ثبت", data.message, "❌", true);
                }
            } catch(e) {
                showStatus("خطای ارتباط", "ارتباط با سرور برقرار نشد.", "❌", true);
            }
        }

        async function submitSell() {
            const amount = parseFloat(document.getElementById('sell-amount').value);
            const txid = document.getElementById('sell-txid').value.trim();
            const network = document.getElementById('sell-network').value;

            if(!amount || amount < 2) { tg.showAlert("❌ حداقل فروش ۲ تتر است."); return; }
            if(!txid) { tg.showAlert("❌ هش تراکنش را وارد کنید."); return; }

            showStatus("در حال بررسی", "سیستم در حال استعلام تراکنش از شبکه است...", "⏳");

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/usdt/sell`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                    body: JSON.stringify({ initData: tg.initData, amount, txid, network })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    showStatus("تایید شد", "تراکنش تایید شد و مبلغ به موجودی شما اضافه گردید.", "✅", true);
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    showStatus("رد شد", data.message, "❌", true);
                }
            } catch(e) {
                showStatus("خطای فنی", "مشکلی در استعلام تراکنش رخ داد.", "❌", true);
            }
        }
    </script>
</body>
</html>
