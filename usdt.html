<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>معامله تتر | کوین باران</title>
    
    <!-- Libraries -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Shared Luxury Styles -->
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=88.0">

    <style>
        /* --- USDT Page Specific Styles --- */
        .exchange-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 25px 20px; margin-bottom: 20px;
            position: relative; overflow: hidden;
        }

        /* تب‌های خرید و فروش */
        .trade-tabs {
            display: flex; background: rgba(0,0,0,0.3);
            border-radius: 16px; padding: 4px; margin-bottom: 25px;
            border: 1px solid var(--glass-border);
        }
        .trade-tab {
            flex: 1; text-align: center; padding: 12px;
            font-size: 0.9rem; font-weight: 700; color: var(--text-muted);
            border-radius: 12px; cursor: pointer; transition: all 0.3s;
        }
        .trade-tab.active.buy {
            background: var(--accent-green); color: #000;
            box-shadow: 0 4px 15px rgba(14, 203, 129, 0.3);
        }
        .trade-tab.active.sell {
            background: var(--accent-red); color: #fff;
            box-shadow: 0 4px 15px rgba(246, 70, 93, 0.3);
        }

        /* نرخ لحظه‌ای */
        .rate-display {
            text-align: center; margin-bottom: 30px;
        }
        .rate-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .rate-value {
            font-family: 'Roboto Mono'; font-size: 2rem; font-weight: 900;
            color: var(--text-white); letter-spacing: 1px;
        }
        .rate-change { font-size: 0.75rem; color: var(--accent-green); margin-top: 5px; }

        /* اینپوت‌های تبدیل */
        .input-container {
            position: relative; margin-bottom: 15px;
        }
        .currency-label {
            position: absolute; top: 50%; left: 15px; transform: translateY(-50%);
            font-weight: bold; color: var(--text-muted); pointer-events: none;
            display: flex; align-items: center; gap: 8px;
        }
        .currency-icon { width: 24px; height: 24px; border-radius: 50%; }
        
        .trade-input {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 18px 15px 18px 80px; /* فضای خالی برای لیبل سمت چپ */
            font-family: 'Roboto Mono'; font-size: 1.4rem; font-weight: 700;
            color: #fff; text-align: right; outline: none;
            transition: border-color 0.3s;
        }
        .trade-input:focus { border-color: var(--gold-primary); }

        /* دکمه اکشن */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 16px;
            border: none; font-size: 1rem; font-weight: 800;
            cursor: pointer; margin-top: 20px; transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .action-btn:active { transform: scale(0.97); }
        .btn-buy { background: var(--accent-green); color: #000; box-shadow: 0 0 20px rgba(14,203,129,0.2); }
        .btn-sell { background: var(--accent-red); color: #fff; box-shadow: 0 0 20px rgba(246,70,93,0.2); }

        /* اطلاعات تکمیلی */
        .info-row {
            display: flex; justify-content: space-between; font-size: 0.8rem;
            color: var(--text-muted); margin-top: 15px; padding: 0 5px;
        }
    </style>
</head>
<body class="loading-active">

    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="grid-overlay"></div>

    <div id="loader">
        <div class="loader-content">
            <div class="spinner-premium"></div>
            <p class="loading-status" style="color:var(--gold-primary); margin-top:20px;">دریافت نرخ لحظه‌ای...</p>
        </div>
    </div>

    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn ripple-btn" onclick="window.location.href='/'">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div style="font-weight:800; font-size:1.1rem; color: #fff;">معامله تتر</div>
        </div>
        <div class="icon-btn ripple-btn" onclick="fetchRates()">
            <i class="fas fa-sync-alt"></i>
        </div>
    </header>

    <div id="app-container" class="hidden-content">
        <div class="main-scroll-area">
            
            <div class="exchange-card">
                
                <!-- Tabs -->
                <div class="trade-tabs">
                    <div class="trade-tab active buy" id="tab-buy" onclick="setMode('buy')">خرید تتر</div>
                    <div class="trade-tab" id="tab-sell" onclick="setMode('sell')">فروش تتر</div>
                </div>

                <!-- Rate -->
                <div class="rate-display">
                    <div class="rate-label">نرخ لحظه‌ای <span id="mode-text">خرید</span></div>
                    <div class="rate-value" id="live-rate">--,---</div>
                    <div class="rate-change">تومان</div>
                </div>

                <!-- Calculator -->
                <div class="input-container">
                    <input type="text" id="input-pay" class="trade-input" placeholder="0" inputmode="numeric">
                    <div class="currency-label">
                        <img src="webapp/images/irt-icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2055/2055266.png'" class="currency-icon">
                        <span id="label-pay">IRT</span>
                    </div>
                </div>

                <div style="text-align:center; margin:-10px 0 5px 0; color:var(--text-muted);">
                    <i class="fas fa-arrow-down"></i>
                </div>

                <div class="input-container">
                    <input type="text" id="input-get" class="trade-input" placeholder="0.00" inputmode="decimal">
                    <div class="currency-label">
                        <img src="webapp/images/usdt-icon.png" onerror="this.src='https://cryptologos.cc/logos/tether-usdt-logo.png'" class="currency-icon">
                        <span id="label-get">USDT</span>
                    </div>
                </div>

                <div class="info-row">
                    <span>موجودی در دسترس:</span>
                    <span style="color:#fff; font-family:'Roboto Mono';" id="avail-balance">Loading...</span>
                </div>

                <button id="action-btn" class="action-btn btn-buy" onclick="executeTrade()">
                    <i class="fas fa-shopping-cart"></i> <span>خرید تتر</span>
                </button>

            </div>

            <div class="section-label" style="margin-top:30px;">وضعیت بازار</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="service-box glass-panel" style="align-items:center; text-align:center;">
                    <span style="color:var(--text-muted); font-size:0.8rem;">سقف خرید</span>
                    <span style="color:#fff; font-weight:bold; font-family:'Roboto Mono';">50,000 USDT</span>
                </div>
                <div class="service-box glass-panel" style="align-items:center; text-align:center;">
                    <span style="color:var(--text-muted); font-size:0.8rem;">کارمزد شبکه</span>
                    <span style="color:var(--accent-green); font-weight:bold;">رایگان</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        
        let currentMode = 'buy'; // buy or sell
        let currentRate = 0;
        let userBalance = { toman: 0, usdt: 0 };

        // --- Init ---
        window.onload = async function() {
            tg.ready(); tg.expand();
            tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505');
            
            if (!tg.initData) tg.initData = "query_id=TEST_DEV";

            await Promise.all([fetchRates(), fetchBalance()]);
            hideLoader();
        };

        // --- Functions ---
        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/usdt/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    window.rates = data; // { buy: 60000, sell: 59000 }
                    updateUI();
                }
            } catch(e) { console.error(e); }
        }

        async function fetchBalance() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/get_user_data`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    userBalance.toman = parseFloat(data.toman_balance.replace(/,/g, ''));
                    userBalance.usdt = parseFloat(data.uusd_balance.replace(/,/g, ''));
                    updateBalanceDisplay();
                }
            } catch(e) { console.error(e); }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-buy').className = `trade-tab ${mode === 'buy' ? 'active buy' : ''}`;
            document.getElementById('tab-sell').className = `trade-tab ${mode === 'sell' ? 'active sell' : ''}`;
            
            const btn = document.getElementById('action-btn');
            if(mode === 'buy') {
                btn.className = 'action-btn btn-buy';
                btn.innerHTML = '<i class="fas fa-shopping-cart"></i> <span>خرید تتر</span>';
                document.getElementById('mode-text').innerText = 'خرید';
                // Swap inputs visually if needed, but keeping simple: Top always Pay, Bottom Get
                document.getElementById('label-pay').innerText = 'IRT';
                document.getElementById('label-get').innerText = 'USDT';
            } else {
                btn.className = 'action-btn btn-sell';
                btn.innerHTML = '<i class="fas fa-money-bill-wave"></i> <span>فروش تتر</span>';
                document.getElementById('mode-text').innerText = 'فروش';
                document.getElementById('label-pay').innerText = 'USDT';
                document.getElementById('label-get').innerText = 'IRT';
            }
            
            updateUI();
            updateBalanceDisplay();
            calculate('pay'); // Recalculate with new rate
        }

        function updateUI() {
            if(!window.rates) return;
            currentRate = currentMode === 'buy' ? window.rates.buy : window.rates.sell;
            document.getElementById('live-rate').innerText = currentRate.toLocaleString();
        }

        function updateBalanceDisplay() {
            const el = document.getElementById('avail-balance');
            if(currentMode === 'buy') {
                el.innerText = `${userBalance.toman.toLocaleString()} IRT`;
            } else {
                el.innerText = `${userBalance.usdt.toLocaleString()} USDT`;
            }
        }

        // --- Calculator ---
        const inPay = document.getElementById('input-pay');
        const inGet = document.getElementById('input-get');

        inPay.addEventListener('input', () => calculate('pay'));
        inGet.addEventListener('input', () => calculate('get'));

        function calculate(source) {
            const payVal = parseFloat(inPay.value.replace(/,/g, '')) || 0;
            const getVal = parseFloat(inGet.value.replace(/,/g, '')) || 0;

            if(source === 'pay') {
                // User typed in "Pay" field
                let result;
                if(currentMode === 'buy') result = payVal / currentRate; // Toman -> USDT
                else result = payVal * currentRate; // USDT -> Toman
                
                if(result > 0) inGet.value = formatNumber(result, currentMode === 'buy' ? 2 : 0);
                else inGet.value = '';
            } else {
                // User typed in "Get" field
                let result;
                if(currentMode === 'buy') result = getVal * currentRate; // Need USDT -> Cost Toman
                else result = getVal / currentRate; // Need Toman -> Sell USDT
                
                if(result > 0) inPay.value = formatNumber(result, currentMode === 'buy' ? 0 : 2);
                else inPay.value = '';
            }
        }

        function formatNumber(num, decimals) {
            return num.toLocaleString('en-US', { maximumFractionDigits: decimals });
        }

        // --- Execute ---
        async function executeTrade() {
            const payAmount = parseFloat(inPay.value.replace(/,/g, ''));
            if(!payAmount || payAmount <= 0) { tg.showAlert("لطفاً مبلغ را وارد کنید"); return; }

            tg.HapticFeedback.impactOccurred('heavy');
            
            // Mock Action (Since we don't have full backend logic for real trade yet)
            // In production, call /webapp/usdt/buy or /sell
            
            if(currentMode === 'sell') {
                 // For Sell, we have an endpoint but it needs TXID (Manual). 
                 // For Auto-Swap inside wallet, we use game/swap logic or create new endpoint.
                 // Here we simulate success for UX.
                 tg.showAlert("⚠️ این بخش در حال حاضر برای معاملات دستی فعال است. لطفاً از منوی ربات استفاده کنید.");
            } else {
                // Buy Logic (Redirect to deposit if low balance)
                if(payAmount > userBalance.toman) {
                     tg.showConfirm("موجودی تومان کافی نیست. آیا می‌خواهید حساب را شارژ کنید؟", (ok) => {
                         if(ok) window.location.href = 'wallet';
                     });
                } else {
                     // Call API to swap internal balance
                     // For now:
                     tg.showAlert("✅ درخواست ثبت شد.");
                }
            }
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-container').classList.remove('hidden-content');
        }
    </script>
</body>
</html>
