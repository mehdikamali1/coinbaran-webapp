# webapp/usdt.html

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ترید تتر | CoinBaran</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        
        :root { 
            --bg: #000000;
            --card-bg: #141414;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --usdt-green: #00D578; /* رنگ نئونی تتر */
            --usdt-dark: #009655;
            --sell-red: #FF3B30;
            --input-bg: #1F1F1F;
            --border: rgba(255,255,255,0.08);
            --glow: 0 0 15px rgba(0, 213, 120, 0.3);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; 
            background: var(--bg); color: var(--text-main); height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            padding: 18px 24px; 
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 10;
        }
        .back-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: var(--text-main); width: 38px; height: 38px; border-radius: 12px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .back-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
        .page-title { margin: 0; font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .tether-logo { width: 24px; height: 24px; }

        /* --- SCROLLABLE CONTENT --- */
        .content { flex: 1; padding: 20px 24px; overflow-y: auto; padding-bottom: 50px; }

        /* --- PRICE TICKER --- */
        .price-card {
            background: linear-gradient(135deg, rgba(0, 213, 120, 0.15) 0%, rgba(20, 20, 20, 0) 100%);
            border: 1px solid rgba(0, 213, 120, 0.2);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .price-item { display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .p-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .p-val { font-family: monospace; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
        .buy-col { color: var(--sell-red); }
        .sell-col { color: var(--usdt-green); text-shadow: 0 0 10px rgba(0, 213, 120, 0.4); }

        /* --- TABS --- */
        .switch-box {
            background: var(--input-bg); border-radius: 16px; padding: 4px;
            display: flex; margin-bottom: 25px; border: 1px solid var(--border);
        }
        .switch-btn {
            flex: 1; padding: 12px; text-align: center; border-radius: 12px;
            font-weight: 700; font-size: 0.95rem; color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
        }
        .switch-btn.active.buy {
            background: var(--usdt-green); color: #000; box-shadow: var(--glow);
        }
        .switch-btn.active.sell {
            background: var(--sell-red); color: #fff; box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
        }

        /* --- FORMS --- */
        .form-section { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .form-section.active { display: block; opacity: 1; transform: translateY(0); }

        .inp-group { margin-bottom: 20px; }
        .inp-label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; margin-right: 4px; }
        
        .input-wrapper { position: relative; }
        .inp-field {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border);
            color: #fff; padding: 16px; padding-left: 50px; border-radius: 16px;
            font-size: 1.1rem; font-weight: 700; font-family: monospace;
            transition: all 0.2s; text-align: right; direction: ltr;
        }
        .inp-field:focus { border-color: var(--usdt-green); background: #000; }
        .inp-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 1rem;
        }
        .inp-suffix {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.9rem; pointer-events: none;
        }

        .select-field {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border);
            color: #fff; padding: 16px; border-radius: 16px; font-size: 1rem;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: left 16px center; background-size: 12px;
        }

        /* --- INFO BOX (For Sell) --- */
        .info-card {
            background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 24px; text-align: center;
        }
        .wallet-address {
            font-family: monospace; font-size: 0.85rem; color: var(--usdt-green);
            word-break: break-all; background: rgba(0, 213, 120, 0.1);
            padding: 10px; border-radius: 8px; margin: 10px 0; select-all: auto;
        }
        .copy-tag {
            font-size: 0.8rem; color: var(--text-muted); display: flex; 
            align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }

        /* --- CALCULATOR --- */
        .calc-result {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; padding: 0 5px;
        }
        .calc-text { font-size: 0.9rem; color: var(--text-muted); }
        .calc-val { font-size: 1.1rem; font-weight: 800; color: #fff; font-family: monospace; }

        /* --- BUTTONS --- */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 30px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: transform 0.1s; color: #fff;
        }
        .action-btn:active { transform: scale(0.97); }
        .btn-green { background: var(--usdt-green); color: #000; box-shadow: var(--glow); }
        .btn-red { background: var(--sell-red); box-shadow: 0 4px 20px rgba(255, 59, 48, 0.3); }
        .btn-disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }

    </style>
</head>
<body>

    <div class="header">
        <div class="back-btn" onclick="window.location.href='/'">
            <i class="fas fa-arrow-right"></i>
        </div>
        <h1 class="page-title">
            <span style="color:var(--usdt-green)">Tether</span> Exchange
        </h1>
        <div style="width:38px"></div>
    </div>

    <div class="content">
        <div class="price-card">
            <div class="price-item">
                <span class="p-label">نرخ خرید (از شما)</span>
                <span class="p-val buy-col" id="rate-buy">...</span>
            </div>
            <div style="width:1px; height:30px; background:var(--border)"></div>
            <div class="price-item" style="align-items:flex-end">
                <span class="p-label">نرخ فروش (به شما)</span>
                <span class="p-val sell-col" id="rate-sell">...</span>
            </div>
        </div>

        <div class="switch-box">
            <div class="switch-btn active buy" onclick="setMode('buy')">خرید USDT</div>
            <div class="switch-btn" onclick="setMode('sell')">فروش USDT</div>
        </div>

        <div id="buy-form" class="form-section active">
            <div class="inp-group">
                <label class="inp-label">مقدار خرید (USDT)</label>
                <div class="input-wrapper">
                    <input type="tel" id="buy-amount" class="inp-field" placeholder="100" oninput="calc('buy')">
                    <span class="inp-icon">₮</span>
                </div>
                <div class="calc-result">
                    <span class="calc-text">مبلغ پرداختی:</span>
                    <span class="calc-val" id="buy-total">0 <span style="font-size:0.8rem;color:#888">تومان</span></span>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label">شبکه انتقال</label>
                <select id="buy-network" class="select-field">
                    <option value="TRC20">Tron (TRC20) - کارمزد پایین</option>
                    <option value="BEP20">BNB Smart Chain (BEP20)</option>
                    <option value="TON">TON Network</option>
                </select>
            </div>

            <div class="inp-group">
                <label class="inp-label">آدرس کیف پول شما</label>
                <div class="input-wrapper">
                    <input type="text" id="buy-address" class="inp-field" placeholder="T..." style="font-size:0.85rem">
                    <i class="fas fa-wallet inp-icon"></i>
                </div>
            </div>

            <button id="btn-buy" class="action-btn btn-green" onclick="submitOrder('buy')">
                <i class="fas fa-bolt"></i> خرید آنی
            </button>
        </div>

        <div id="sell-form" class="form-section">
            <div class="inp-group">
                <label class="inp-label">شبکه واریز</label>
                <select id="sell-network" class="select-field" onchange="updateWalletAddress()">
                    <option value="TRC20">Tron (TRC20)</option>
                    <option value="BEP20">BNB Smart Chain (BEP20)</option>
                </select>
            </div>

            <div class="info-card">
                <span style="font-size:0.85rem; color:#aaa">تترها را به آدرس زیر واریز کنید:</span>
                <div id="admin-wallet-address" class="wallet-address">Loading...</div>
                <div class="copy-tag" onclick="copyAddress()">
                    <i class="fas fa-copy"></i> کپی کردن آدرس
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label">مقدار واریزی (USDT)</label>
                <div class="input-wrapper">
                    <input type="tel" id="sell-amount" class="inp-field" placeholder="50" oninput="calc('sell')">
                    <span class="inp-icon">₮</span>
                </div>
                <div class="calc-result">
                    <span class="calc-text">دریافتی شما:</span>
                    <span class="calc-val" id="sell-total" style="color:var(--usdt-green)">0 <span style="font-size:0.8rem;color:#888">تومان</span></span>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label">هش تراکنش (TxID)</label>
                <div class="input-wrapper">
                    <input type="text" id="sell-txid" class="inp-field" placeholder="شناسه تراکنش..." style="font-size:0.85rem">
                    <i class="fas fa-hashtag inp-icon"></i>
                </div>
            </div>

            <button id="btn-sell" class="action-btn btn-red" onclick="submitOrder('sell')">
                <i class="fas fa-check-circle"></i> ثبت فروش
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        
        // --- تنظیمات آدرس‌ها (این‌ها را از کانفیگ سرور می‌خوانیم یا اینجا ست می‌کنیم) ---
        const WALLETS = {
            'TRC20': 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t', // Example: Tether Contract (Change to yours)
            'BEP20': '0x55d398326f99059fF775485246999027B3197955' // Example
        };

        let rates = { buy: 0, sell: 0 }; // Buy: کاربر می‌فروشد | Sell: کاربر می‌خرد

        window.onload = function() {
            tg.ready(); tg.expand(); tg.setHeaderColor('#141414');
            if (!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1700000000&hash=fake";
            
            fetchRates();
            updateWalletAddress(); // Set initial address
        };

        function setMode(mode) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active', 'buy', 'sell'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

            if(mode === 'buy') {
                document.querySelector('.switch-btn:nth-child(1)').classList.add('active', 'buy');
                document.getElementById('buy-form').classList.add('active');
            } else {
                document.querySelector('.switch-btn:nth-child(2)').classList.add('active', 'sell');
                document.getElementById('sell-form').classList.add('active');
            }
        }

        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/usdt/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.sell; // نرخی که کاربر می‌خرد (Admin Sell)
                    rates.sell = data.buy; // نرخی که کاربر می‌فروشد (Admin Buy)
                    
                    document.getElementById('rate-sell').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-buy').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) { console.error("Rate Fetch Error", e); }
        }

        function updateWalletAddress() {
            const net = document.getElementById('sell-network').value;
            const addr = WALLETS[net] || "Loading...";
            document.getElementById('admin-wallet-address').innerText = addr;
        }

        function copyAddress() {
            const text = document.getElementById('admin-wallet-address').innerText;
            navigator.clipboard.writeText(text);
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("✅ آدرس کیف پول کپی شد!");
        }

        function calc(mode) {
            const amount = parseFloat(document.getElementById(mode + '-amount').value);
            const displayEl = document.getElementById(mode + '-total');
            
            if (isNaN(amount) || amount <= 0) {
                displayEl.innerHTML = `0 <span style="font-size:0.8rem;color:#888">تومان</span>`;
                return;
            }

            let price = (mode === 'buy') ? rates.buy : rates.sell;
            let total = amount * price;
            
            displayEl.innerHTML = `${parseInt(total).toLocaleString()} <span style="font-size:0.8rem;color:#888">تومان</span>`;
        }

        async function submitOrder(mode) {
            tg.HapticFeedback.impactOccurred('medium');
            const btn = document.getElementById(`btn-${mode}`);
            const originalText = btn.innerHTML;
            
            // Validation
            const amount = parseFloat(document.getElementById(`${mode}-amount`).value);
            if(!amount || amount < 2) { tg.showAlert("حداقل مقدار ۲ تتر است."); return; }

            let payload = { initData: tg.initData, amount: amount };
            let endpoint = "";

            if (mode === 'buy') {
                const address = document.getElementById('buy-address').value;
                if(address.length < 10) { tg.showAlert("آدرس کیف پول نامعتبر است."); return; }
                payload.address = address;
                payload.network = document.getElementById('buy-network').value;
                endpoint = "/webapp/usdt/buy";
            } else {
                const txid = document.getElementById('sell-txid').value;
                if(txid.length < 10) { tg.showAlert("شناسه تراکنش (TxID) وارد نشده است."); return; }
                payload.txid = txid;
                payload.network = document.getElementById('sell-network').value;
                endpoint = "/webapp/usdt/sell";
            }

            // UI Loading State
            btn.disabled = true;
            btn.classList.add('btn-disabled');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال پردازش...';

            try {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert("✅ " + data.message);
                    // Clear inputs
                    document.getElementById(`${mode}-amount`).value = "";
                    if(mode === 'sell') document.getElementById('sell-txid').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch (e) {
                tg.showAlert("خطای ارتباط با سرور");
            } finally {
                btn.disabled = false;
                btn.classList.remove('btn-disabled');
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
