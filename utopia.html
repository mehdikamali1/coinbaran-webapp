<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صرافی یوتوپیا | کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=33.0">

    <style>
        :root {
            --gold-primary: #f0b90b;
            --color-up: #0ecb81;
            --color-down: #f6465d;
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-dark: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        .main-scroll-area { padding: 20px; padding-bottom: 150px; }

        /* --- Header Style --- */
        .glass-header {
            position: sticky; top:0; z-index:100;
            background: rgba(5,5,5,0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px; display: flex; align-items: center;
        }

        /* --- Ticker Card --- */
        .ticker-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px;
            margin-bottom: 25px; display: flex; justify-content: space-between;
        }
        .ticker-col { display: flex; flex-direction: column; gap: 6px; }
        .ticker-label { font-size: 0.75rem; color: #848e9c; }
        .ticker-val { font-family: 'Roboto Mono', monospace; font-size: 1.25rem; font-weight: 800; }
        .col-buy { color: var(--color-down); } 
        .col-sell { color: var(--color-up); }

        /* --- Tabs --- */
        .switch-tabs {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 5px; display: flex; margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1; padding: 12px; text-align: center; border-radius: 12px;
            font-weight: 700; font-size: 0.9rem; color: #848e9c;
            cursor: pointer; transition: all 0.3s;
        }
        .tab-btn.active { background: var(--gold-primary); color: #000; box-shadow: 0 4px 12px rgba(240, 185, 11, 0.2); }

        /* --- Inputs --- */
        .input-box { margin-bottom: 20px; }
        .inp-label { display: block; color: #848e9c; font-size: 0.85rem; margin-bottom: 8px; }
        .glass-inp {
            width: 100%; background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid var(--glass-border); color: #fff !important;
            padding: 16px; border-radius: 16px;
            font-size: 1.1rem; font-weight: 700; font-family: 'Roboto Mono', monospace;
            text-align: left; direction: ltr; outline: none; transition: 0.3s;
        }
        .glass-inp:focus { border-color: var(--gold-primary); background: rgba(255,255,255,0.12) !important; }
        
        .glass-inp::placeholder { color: #555; }

        /* --- Calc Row --- */
        .calc-row { display: flex; justify-content: space-between; padding: 0 5px; margin-bottom: 20px; }
        .calc-val { font-family: 'Roboto Mono'; font-weight: 700; color: var(--gold-primary); font-size: 1.1rem; }

        /* --- Buttons --- */
        .btn-submit {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s; margin-top: 10px;
        }
        .bg-gold { background: var(--gold-primary); color: #000; }
        .bg-green { background: var(--color-up); color: #000; }

        /* --- Voucher Result Card --- */
        .result-card {
            display: none; background: rgba(14, 203, 129, 0.1);
            border: 1px dashed var(--color-up);
            padding: 20px; border-radius: 20px;
            margin-top: 25px; text-align: center;
        }
        .code-display {
            font-family: 'Roboto Mono', monospace; font-size: 1.1rem;
            color: #fff; background: rgba(0,0,0,0.3);
            padding: 12px; border-radius: 10px; margin: 15px 0;
            word-break: break-all; border: 1px solid var(--glass-border);
        }
        .copy-btn {
            background: transparent; border: 1px solid var(--color-up);
            color: var(--color-up); padding: 6px 20px; border-radius: 20px;
            font-size: 0.9rem; cursor: pointer;
        }

        .section-box { display: none; animation: fadeIn 0.3s ease; }
        .section-box.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

    <header class="glass-header">
        <div class="icon-btn" onclick="window.location.href='/'" style="cursor:pointer; padding: 10px; margin-left:10px;">
            <i class="fas fa-arrow-right" style="font-size:1.2rem; color:#fff;"></i>
        </div>
        <div style="font-weight:900; font-size:1.2rem; display:flex; align-items:center; gap:8px;">
            <i class="fas fa-gem" style="color:var(--gold-primary)"></i>
            تبادل یوتوپیا (UUSD)
        </div>
    </header>

    <div class="main-scroll-area">
        
        <div class="ticker-card">
            <div class="ticker-col">
                <span class="ticker-label">نرخ خرید (از شما)</span>
                <span class="ticker-val col-sell" id="rate-buy">---</span>
            </div>
            <div style="width:1px; height:40px; background:var(--glass-border)"></div>
            <div class="ticker-col" style="align-items:flex-end">
                <span class="ticker-label">نرخ فروش (به شما)</span>
                <span class="ticker-val col-buy" id="rate-sell">---</span>
            </div>
        </div>

        <div class="switch-tabs">
            <div class="tab-btn active" onclick="switchTab('buy')">خرید ووچر</div>
            <div class="tab-btn" onclick="switchTab('sell')">فروش ووچر</div>
        </div>

        <div id="buy-section" class="section-box active">
            <div class="input-box">
                <label class="inp-label">مقدار خرید (دلار)</label>
                <input type="number" id="buy-amount" class="glass-inp" placeholder="10.00" oninput="calcPrice()">
            </div>
            
            <div class="calc-row">
                <span style="font-size:0.85rem; color:#848e9c">مبلغ پرداختی شما:</span>
                <span class="calc-val" id="buy-total">0 تومان</span>
            </div>

            <button id="btn-do-buy" class="btn-submit bg-gold" onclick="doBuy()">
                <i class="fas fa-shopping-cart"></i> 
                <span>خرید آنی ووچر</span>
            </button>
            
            <div id="buy-result" class="result-card">
                <div style="color:var(--color-up); font-weight:900; font-size:1.1rem; margin-bottom:5px">
                    <i class="fas fa-check-circle"></i> خرید موفق
                </div>
                <div style="font-size:0.8rem; color:#aaa">ووچر اختصاصی شما صادر شد:</div>
                <div id="new-voucher-code" class="code-display">---</div>
                <button class="copy-btn" onclick="copyCode()">
                    <i class="fas fa-copy"></i> کپی کد
                </button>
            </div>
        </div>

        <div id="sell-section" class="section-box">
            <div class="input-box">
                <label class="inp-label">کد ووچر یوتوپیا</label>
                <input type="text" id="sell-code" class="glass-inp" placeholder="UTP-..." style="font-size:0.9rem;">
            </div>
            
            <div style="background:rgba(255,255,255,0.05); border-radius:12px; padding:15px; margin-bottom:20px; border:1px solid var(--glass-border);">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                    <i class="fas fa-info-circle" style="color:var(--gold-primary)"></i>
                    <span style="font-size:0.85rem; font-weight:bold;">نقد کردن آنی</span>
                </div>
                <p style="margin:0; font-size:0.75rem; color:#888; line-height:1.6;">
                    سیستم به صورت خودکار ووچر را استعلام گرفته و مبلغ ریالی آن را همان لحظه به کیف پول شما واریز می‌کند.
                </p>
            </div>

            <button id="btn-do-sell" class="btn-submit bg-green" onclick="doSell()">
                <i class="fas fa-exchange-alt"></i> 
                <span>استعلام و نقد کردن</span>
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        // آدرس صحیح API
        const API_BASE_URL = window.location.origin + "/api/webapp"; 
        
        let rates = { buy: 0, sell: 0 };

        window.onload = function() {
            tg.ready(); tg.expand(); tg.setHeaderColor('#050505'); // هماهنگ با رنگ هدر جدید
            if (!tg.initData) tg.initData = "query_id=TEST_MODE"; 
            fetchRates();
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
            
            if(tab === 'buy') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('buy-section').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('sell-section').classList.add('active');
            }
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        async function fetchRates() {
            try {
                const url = `${API_BASE_URL}/utopia/rates?t=${Date.now()}`;
                const res = await fetch(url, {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });

                if (res.status !== 200) {
                    console.error("Server Error:", await res.text());
                    return;
                }

                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; 
                    rates.sell = data.sell;
                    
                    // در اینجا rate-buy یعنی نرخ خرید ما از مشتری (که مشتری میفروشه)
                    // و rate-sell یعنی نرخ فروش ما به مشتری (که مشتری میخره)
                    document.getElementById('rate-buy').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-sell').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) {
                console.error("Fetch error:", e);
            }
        }

        function calcPrice() {
            const val = parseFloat(document.getElementById('buy-amount').value);
            // محاسبه بر اساس نرخ فروش ما (rates.sell)
            if(val > 0 && rates.sell > 0) {
                const total = val * rates.sell;
                document.getElementById('buy-total').innerText = parseInt(total).toLocaleString() + " تومان";
            } else {
                document.getElementById('buy-total').innerText = "0 تومان";
            }
        }

        async function doBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const btn = document.getElementById('btn-do-buy');
            
            if(!amount || amount < 1) { tg.showAlert("حداقل خرید ۱ دلار است."); return; }

            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال پردازش...';
            document.getElementById('buy-result').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE_URL}/utopia/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount_usd: amount })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('new-voucher-code').innerText = data.voucher_code;
                    document.getElementById('buy-result').style.display = 'block';
                    tg.showAlert("✅ خرید موفقیت آمیز بود");
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه: " + e.message); }
            
            btn.disabled = false; 
            btn.innerHTML = '<i class="fas fa-shopping-cart"></i> <span>خرید آنی ووچر</span>';
        }

        async function doSell() {
            const code = document.getElementById('sell-code').value.trim();
            const btn = document.getElementById('btn-do-sell');
            
            if(code.length < 5) { tg.showAlert("کد نامعتبر است."); return; }

            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال استعلام...';

            try {
                const res = await fetch(`${API_BASE_URL}/utopia/sell`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, voucher_code: code })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`✅ فروخته شد!\nمبلغ ${parseInt(data.amount_toman).toLocaleString()} تومان به کیف پول شما واریز شد.`);
                    document.getElementById('sell-code').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه: " + e.message); }

            btn.disabled = false; 
            btn.innerHTML = '<i class="fas fa-exchange-alt"></i> <span>استعلام و نقد کردن</span>';
        }

        function copyCode() {
            const code = document.getElementById('new-voucher-code').innerText;
            navigator.clipboard.writeText(code);
            tg.showAlert("کد کپی شد!");
            tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
