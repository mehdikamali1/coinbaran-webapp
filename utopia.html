# webapp/utopia.html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صرافی یوتوپیا</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');
        
        :root { 
            --bg: #050505; --card: #121212; --text: #EAEAEA; --muted: #888;
            --utopia: #FF007A; /* رنگ برند یوتوپیا */
            --green: #10B981; --border: rgba(255,255,255,0.08);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; 
            background: var(--bg); color: var(--text); height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* Header */
        .header {
            padding: 15px 20px; background: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer;
        }
        .page-title { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--utopia); }

        /* Price Ticker */
        .ticker-box {
            display: flex; justify-content: space-between; padding: 15px 20px;
            background: linear-gradient(90deg, rgba(255,0,122,0.1) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid var(--border); margin-bottom: 20px;
        }
        .ticker-item { display: flex; flex-direction: column; }
        .ticker-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
        .ticker-val { font-family: monospace; font-weight: 700; font-size: 1rem; }

        /* Tabs */
        .tabs { display: flex; padding: 0 20px; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 12px; border-radius: 12px; background: var(--card);
            border: 1px solid var(--border); color: var(--muted); font-weight: 700;
            cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .tab-btn.active {
            background: var(--utopia); color: white; border-color: var(--utopia);
            box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4);
        }

        /* Content */
        .content { flex: 1; padding: 0 20px; overflow-y: auto; }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Forms */
        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { display: block; color: var(--text); margin-bottom: 10px; font-size: 0.9rem; }
        .inp-field {
            width: 100%; background: #0E0E0E; border: 1px solid #333; color: white;
            padding: 16px; border-radius: 14px; font-size: 1.2rem; font-weight: 700;
            font-family: monospace; text-align: center; transition: border 0.2s;
        }
        .inp-field:focus { border-color: var(--utopia); }
        
        .calc-box {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px;
            text-align: center; margin-bottom: 25px; border: 1px dashed var(--border);
        }
        .calc-res { font-size: 1.4rem; font-weight: 800; color: var(--green); margin-top: 5px; display: block; }

        /* Buttons */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-bottom: 20px;
            color: white; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .action-btn:active { transform: scale(0.98); }
        .btn-buy { background: linear-gradient(135deg, #FF007A 0%, #B30056 100%); box-shadow: 0 4px 20px rgba(255,0,122,0.3); }
        .btn-sell { background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); }
        .btn-disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        /* Success Voucher Box */
        .voucher-result {
            background: #1A1A1A; border: 1px solid var(--utopia); border-radius: 16px;
            padding: 20px; text-align: center; margin-top: 20px; display: none;
        }
        .voucher-code {
            font-family: monospace; font-size: 1.1rem; color: white; word-break: break-all;
            background: black; padding: 10px; border-radius: 8px; margin: 10px 0; select-all: auto;
        }
        .copy-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.location.href='/'">
            <i class="fas fa-arrow-right"></i> بازگشت
        </button>
        <h1 class="page-title">💎 صرافی یوتوپیا</h1>
        <div style="width:40px"></div>
    </div>

    <div class="ticker-box">
        <div class="ticker-item">
            <span class="ticker-label">قیمت خرید (ما از شما)</span>
            <span class="ticker-val" style="color:var(--green)" id="rate-sell">...</span>
        </div>
        <div class="ticker-item" style="text-align:left">
            <span class="ticker-label">قیمت فروش (ما به شما)</span>
            <span class="ticker-val" style="color:var(--utopia)" id="rate-buy">...</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('buy')">خرید ووچر</div>
        <div class="tab-btn" onclick="switchTab('sell')">فروش ووچر</div>
    </div>

    <div class="content">
        <div id="buy-section" class="section active">
            <div class="input-group">
                <label class="input-label">مقدار مورد نظر (دلار UUSD):</label>
                <input type="number" id="buy-amount" class="inp-field" placeholder="مثلا 10" oninput="calcPrice()">
            </div>

            <div class="calc-box">
                <span style="color:#888;font-size:0.9rem">مبلغ قابل پرداخت (تومان)</span>
                <span id="buy-total" class="calc-res">0</span>
            </div>

            <button id="btn-do-buy" class="action-btn btn-buy" onclick="doBuy()">
                <i class="fas fa-shopping-cart"></i> خرید آنی
            </button>

            <div id="buy-result" class="voucher-result">
                <div style="color:var(--green);font-weight:bold;margin-bottom:10px">✅ خرید با موفقیت انجام شد!</div>
                <div style="font-size:0.9rem;color:#aaa">کد ووچر شما:</div>
                <div id="new-voucher-code" class="voucher-code">...</div>
                <button class="copy-btn" onclick="copyCode()">کپی کردن</button>
            </div>
        </div>

        <div id="sell-section" class="section">
            <div class="input-group">
                <label class="input-label">کد ووچر یوتوپیا:</label>
                <input type="text" id="sell-code" class="inp-field" placeholder="UTP...code..." style="font-size:0.9rem">
            </div>

            <div style="background:rgba(16, 185, 129, 0.1); border:1px solid rgba(16, 185, 129, 0.2); border-radius:12px; padding:15px; margin-bottom:25px; font-size:0.85rem; line-height:1.6; color:#ddd">
                ℹ️ سیستم به صورت خودکار ووچر را بررسی و نقد می‌کند. مبلغ ریالی آنی به کیف پول شما واریز خواهد شد.
            </div>

            <button id="btn-do-sell" class="action-btn btn-sell" onclick="doSell()">
                <i class="fas fa-exchange-alt"></i> استعلام و فروش
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        let rates = { buy: 0, sell: 0 }; // buy: نرخ فروش ما به کاربر | sell: نرخ خرید ما از کاربر

        window.onload = function() {
            tg.ready(); tg.expand(); tg.setHeaderColor('#121212');
            if (!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1700000000&hash=fake";
            fetchRates();
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if(tab === 'buy') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('buy-section').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('sell-section').classList.add('active');
            }
        }

        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; // قیمتی که کاربر میخرد (Sell Rate دیتابیس)
                    rates.sell = data.sell; // قیمتی که کاربر میفروشد (Buy Rate دیتابیس)
                    
                    document.getElementById('rate-buy').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-sell').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) { console.error(e); }
        }

        function calcPrice() {
            const val = parseFloat(document.getElementById('buy-amount').value);
            if(val > 0 && rates.buy > 0) {
                const total = val * rates.buy;
                document.getElementById('buy-total').innerText = parseInt(total).toLocaleString();
            } else {
                document.getElementById('buy-total').innerText = "0";
            }
        }

        async function doBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const btn = document.getElementById('btn-do-buy');
            const resultBox = document.getElementById('buy-result');
            
            if(!amount || amount < 1) { tg.showAlert("حداقل خرید ۱ دلار است."); return; }

            tg.HapticFeedback.impactOccurred('medium');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال پردازش...';
            btn.classList.add('btn-disabled');
            resultBox.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount_usd: amount })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('new-voucher-code').innerText = data.voucher_code;
                    resultBox.style.display = 'block';
                    tg.showAlert(`✅ خرید انجام شد! مبلغ ${parseInt(data.cost).toLocaleString()} تومان کسر شد.`);
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }
            
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-shopping-cart"></i> خرید آنی';
            btn.classList.remove('btn-disabled');
        }

        async function doSell() {
            const code = document.getElementById('sell-code').value.trim();
            const btn = document.getElementById('btn-do-sell');
            
            if(code.length < 10) { tg.showAlert("کد ووچر معتبر نیست."); return; }

            tg.HapticFeedback.impactOccurred('medium');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال استعلام...';
            btn.classList.add('btn-disabled');

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/sell`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, voucher_code: code })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`✅ فروخته شد!\n\nمبلغ ${parseInt(data.amount_toman).toLocaleString()} تومان به کیف پول شما واریز شد.`);
                    document.getElementById('sell-code').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }

            btn.disabled = false; btn.innerHTML = '<i class="fas fa-exchange-alt"></i> استعلام و فروش';
            btn.classList.remove('btn-disabled');
        }

        function copyCode() {
            const code = document.getElementById('new-voucher-code').innerText;
            navigator.clipboard.writeText(code);
            tg.showAlert("کد کپی شد!");
        }
    </script>
</body>
</html>
