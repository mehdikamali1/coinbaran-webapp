<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صرافی یوتوپیا | کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=30.0">

    <style>
        /* استایل‌های اختصاصی یوتوپیا */
        :root { --utopia-pink: #FF007A; }

        .utopia-ticker {
            background: linear-gradient(135deg, rgba(255, 0, 122, 0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid rgba(255, 0, 122, 0.3);
            border-radius: var(--radius-lg);
            padding: 20px; display: flex; justify-content: space-between;
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .utopia-ticker::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(255, 0, 122, 0.15), transparent 60%);
            pointer-events: none;
        }
        
        .tick-item { display: flex; flex-direction: column; gap: 5px; z-index: 2; }
        .tick-label { font-size: 0.75rem; color: var(--text-muted); }
        .tick-val { font-family: monospace; font-size: 1.2rem; font-weight: 800; }
        
        .c-buy { color: var(--color-up); }      /* ما از کاربر میخریم (سبز) */
        .c-sell { color: var(--utopia-pink); }  /* ما به کاربر میفروشیم (صورتی) */

        /* تب‌ها */
        .u-tabs {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 5px; display: flex; margin-bottom: 25px;
        }
        .u-tab {
            flex: 1; padding: 12px; text-align: center; border-radius: 12px;
            font-weight: 700; font-size: 0.9rem; color: var(--text-muted);
            cursor: pointer; transition: all 0.3s;
        }
        .u-tab.active { color: #fff; box-shadow: 0 0 15px rgba(255,0,122,0.3); }
        .u-tab.active:nth-child(1) { background: var(--utopia-pink); }
        .u-tab.active:nth-child(2) { background: var(--color-up); box-shadow: 0 0 15px rgba(14, 203, 129, 0.3); }

        .section-box { display: none; animation: fadeIn 0.4s ease; }
        .section-box.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ووچر باکس نتیجه */
        .voucher-res {
            background: #000; border: 1px dashed var(--utopia-pink);
            border-radius: 16px; padding: 20px; text-align: center;
            margin-top: 20px; display: none;
        }
        .v-code-box {
            font-family: monospace; font-size: 1.1rem; color: #fff;
            background: rgba(255, 0, 122, 0.1); padding: 12px;
            border-radius: 8px; margin: 15px 0; word-break: break-all;
            border: 1px solid rgba(255, 0, 122, 0.3);
        }

        .btn-pink { background: var(--utopia-pink); box-shadow: 0 5px 20px rgba(255, 0, 122, 0.3); }
        .btn-green { background: var(--color-up); color: #000; box-shadow: 0 5px 20px rgba(14, 203, 129, 0.3); }

    </style>
</head>
<body>

    <div class="ambient-glow glow-top" style="background:var(--utopia-pink)"></div>
    <div class="scanlines"></div>

    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn" onclick="window.location.href='/'">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div style="font-weight:800; font-size:1.1rem">صرافی <span style="color:var(--utopia-pink)">یوتوپیا</span></div>
        </div>
        <div style="width:40px"></div>
    </header>

    <div class="glass-wrapper main-scroll-area">
        
        <div class="utopia-ticker">
            <div class="tick-item">
                <span class="tick-label">قیمت خرید (از شما)</span>
                <span class="tick-val c-buy" id="rate-sell">...</span>
            </div>
            <div style="width:1px; background:rgba(255,255,255,0.1)"></div>
            <div class="tick-item" style="align-items:flex-end">
                <span class="tick-label">قیمت فروش (به شما)</span>
                <span class="tick-val c-sell" id="rate-buy">...</span>
            </div>
        </div>

        <div class="u-tabs">
            <div class="u-tab active" onclick="switchTab('buy')">خرید ووچر</div>
            <div class="u-tab" onclick="switchTab('sell')">فروش ووچر</div>
        </div>

        <div id="buy-section" class="section-box active">
            <div class="glass-input-group">
                <label class="input-label">مقدار مورد نظر (دلار UUSD)</label>
                <div class="input-box">
                    <input type="number" id="buy-amount" class="glass-field" placeholder="10" oninput="calcPrice()">
                    <span class="field-icon" style="color:var(--utopia-pink)">$</span>
                </div>
                <div class="calc-info">
                    <span class="calc-label">مبلغ قابل پرداخت:</span>
                    <span class="calc-value" id="buy-total">0 <span style="font-size:0.7rem; color:#888">تومان</span></span>
                </div>
            </div>

            <button id="btn-do-buy" class="btn-action-large btn-pink" onclick="doBuy()">
                <i class="fas fa-shopping-cart"></i> خرید آنی
            </button>

            <div id="buy-result" class="voucher-res">
                <div style="color:var(--color-up); font-weight:800; margin-bottom:10px">✅ خرید موفق!</div>
                <div style="font-size:0.8rem; color:#aaa">کد ووچر اختصاصی شما:</div>
                <div id="new-voucher-code" class="v-code-box">...</div>
                <button class="action-item" style="margin:0 auto; padding:8px 20px; font-size:0.8rem; background:rgba(255,255,255,0.1); border:none; border-radius:20px; color:#fff;" onclick="copyCode()">
                    <i class="fas fa-copy"></i> کپی کردن
                </button>
            </div>
        </div>

        <div id="sell-section" class="section-box">
            <div class="glass-input-group">
                <label class="input-label">کد ووچر یوتوپیا</label>
                <div class="input-box">
                    <input type="text" id="sell-code" class="glass-field" placeholder="UTP..." style="font-size:0.9rem">
                    <i class="fas fa-ticket-alt field-icon" style="color:var(--color-up)"></i>
                </div>
            </div>

            <div style="background:rgba(14, 203, 129, 0.1); border:1px dashed var(--color-up); border-radius:12px; padding:15px; margin-bottom:20px;">
                <p style="margin:0; font-size:0.8rem; line-height:1.6; color:#eee;">
                    ℹ️ سیستم به صورت خودکار ووچر را بررسی می‌کند و مبلغ ریالی آنی به کیف پول شما واریز می‌شود.
                </p>
            </div>

            <button id="btn-do-sell" class="btn-action-large btn-green" onclick="doSell()">
                <i class="fas fa-exchange-alt"></i> استعلام و نقد کردن
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        let rates = { buy: 0, sell: 0 };

        window.onload = function() {
            tg.ready(); tg.expand(); tg.setHeaderColor('#000000');
            if (!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1700000000&hash=fake";
            fetchRates();
        };

        function switchTab(tab) {
            document.querySelectorAll('.u-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
            
            if(tab === 'buy') {
                document.querySelector('.u-tab:nth-child(1)').classList.add('active');
                document.getElementById('buy-section').classList.add('active');
            } else {
                document.querySelector('.u-tab:nth-child(2)').classList.add('active');
                document.getElementById('sell-section').classList.add('active');
            }
        }

        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; 
                    rates.sell = data.sell; 
                    document.getElementById('rate-buy').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-sell').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) { console.error(e); }
        }

        function calcPrice() {
            const val = parseFloat(document.getElementById('buy-amount').value);
            if(val > 0 && rates.buy > 0) {
                const total = val * rates.buy;
                document.getElementById('buy-total').innerHTML = `${parseInt(total).toLocaleString()} <span style="font-size:0.7rem; color:#888">تومان</span>`;
            } else {
                document.getElementById('buy-total').innerHTML = `0 <span style="font-size:0.7rem; color:#888">تومان</span>`;
            }
        }

        async function doBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const btn = document.getElementById('btn-do-buy');
            const resultBox = document.getElementById('buy-result');
            
            if(!amount || amount < 1) { tg.showAlert("حداقل خرید ۱ دلار است."); return; }

            tg.HapticFeedback.impactOccurred('medium');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> پردازش...';
            btn.style.opacity = '0.7';
            resultBox.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount_usd: amount })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('new-voucher-code').innerText = data.voucher_code;
                    resultBox.style.display = 'block';
                    tg.showAlert(`✅ خرید انجام شد! مبلغ ${parseInt(data.cost).toLocaleString()} تومان کسر شد.`);
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }
            
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-shopping-cart"></i> خرید آنی';
            btn.style.opacity = '1';
        }

        async function doSell() {
            const code = document.getElementById('sell-code').value.trim();
            const btn = document.getElementById('btn-do-sell');
            
            if(code.length < 10) { tg.showAlert("کد ووچر معتبر نیست."); return; }

            tg.HapticFeedback.impactOccurred('medium');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال استعلام...';
            btn.style.opacity = '0.7';

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/sell`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, voucher_code: code })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`✅ فروخته شد!\n\nمبلغ ${parseInt(data.amount_toman).toLocaleString()} تومان به کیف پول شما واریز شد.`);
                    document.getElementById('sell-code').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }

            btn.disabled = false; btn.innerHTML = '<i class="fas fa-exchange-alt"></i> استعلام و نقد کردن';
            btn.style.opacity = '1';
        }

        function copyCode() {
            const code = document.getElementById('new-voucher-code').innerText;
            navigator.clipboard.writeText(code);
            tg.showAlert("کد کپی شد!");
        }
    </script>
</body>
</html>
