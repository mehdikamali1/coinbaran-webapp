<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صرافی یوتوپیا | Coin Baran</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=100.0">
</head>
<body class="loading-active">

    <div class="ambient-glow" style="background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.15), transparent 70%);"></div>
    <div class="grid-pattern"></div>

    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-right"></i></div>
            
            <div style="display:flex; align-items:center; gap:10px; margin-right:10px;">
                <img src="webapp/images/utopia.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'" style="width:28px; height:28px;" alt="logo">
                <span style="font-weight:700; font-size:1rem; letter-spacing:0.5px;">صرافی یوتوپیا</span>
            </div>
        </div>
        <div style="width:40px"></div>
    </header>

    <div class="glass-wrapper">
        
        <div class="utopia-card">
            <div class="rate-group">
                <span class="rate-label">خرید (از ما)</span>
                <span class="rate-val" style="color:var(--utopia-accent)" id="rate-sell">...</span>
            </div>
            <div style="width:1px; height:30px; background:var(--glass-border)"></div>
            <div class="rate-group" style="align-items:flex-end">
                <span class="rate-label">فروش (به ما)</span>
                <span class="rate-val" style="color:var(--color-up)" id="rate-buy">...</span>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab-btn active buy-mode" onclick="switchTab('buy')">خرید ووچر</div>
            <div class="tab-btn" onclick="switchTab('sell')">فروش ووچر</div>
        </div>

        <div id="buy-section" class="section-box active">
            <div style="margin-bottom:25px;">
                <label style="display:block; color:#aaa; margin-bottom:10px; font-size:0.85rem;">مقدار ووچر (دلار)</label>
                <input type="number" id="buy-amount" class="glass-inp" placeholder="مثلا: 10" oninput="calcPrice()">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 5px;">
                <span style="color:#666; font-size:0.85rem;">مبلغ قابل پرداخت</span>
                <span id="buy-total" style="color:#fff; font-weight:700; font-family:monospace; font-size:1.1rem;">0 T</span>
            </div>

            <button id="btn-do-buy" class="btn-action btn-cyan" onclick="doBuy()">
                <span>خرید آنی</span> <i class="fas fa-bolt"></i>
            </button>
            
            <div id="buy-result" class="result-box">
                <div style="color:var(--color-up); font-weight:800; margin-bottom:10px; font-size:1.1rem;">✅ خرید موفق</div>
                <div style="font-size:0.8rem; color:#aaa; margin-bottom:8px;">کد ووچر اختصاصی شما:</div>
                <div id="new-voucher-code" style="font-family:monospace; font-size:1rem; color:#fff; background:rgba(0,0,0,0.3); padding:12px; border-radius:8px; margin-bottom:15px; word-break:break-all; border:1px solid rgba(255,255,255,0.1);">...</div>
                <button onclick="copyCode()" style="background:transparent; border:1px solid var(--utopia-accent); color:var(--utopia-accent); padding:6px 20px; border-radius:20px; font-size:0.8rem; cursor:pointer;">کپی کردن</button>
            </div>
        </div>

        <div id="sell-section" class="section-box">
            <div style="margin-bottom:25px;">
                <label style="display:block; color:#aaa; margin-bottom:10px; font-size:0.85rem;">کد ووچر یوتوپیا</label>
                <input type="text" id="sell-code" class="glass-inp" placeholder="UTP-..." style="font-size:1rem;">
            </div>
            
            <div style="background:rgba(14, 203, 129, 0.05); border:1px solid rgba(14, 203, 129, 0.2); border-radius:12px; padding:15px; text-align:center;">
                <i class="fas fa-shield-alt" style="color:var(--color-up); margin-bottom:8px; font-size:1.2rem;"></i>
                <p style="margin:0; font-size:0.75rem; color:#aaa; line-height:1.6;">سیستم به صورت خودکار ووچر را بررسی و مبلغ ریالی را آنی به کیف پول شما واریز می‌کند.</p>
            </div>

            <button id="btn-do-sell" class="btn-action btn-green" onclick="doSell()">
                <span>نقد کردن</span> <i class="fas fa-arrow-down"></i>
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;
        let rates = { buy: 0, sell: 0 };

        window.onload = function() {
            tg.ready(); tg.expand(); 
            // تنظیم رنگ هدر برای هماهنگی با تم مشکی
            tg.setHeaderColor('#000000'); 
            tg.setBackgroundColor('#000000');
            
            // بازگشت به داشبورد
            tg.BackButton.show();
            tg.BackButton.onClick(function() { window.location.href = 'dashboard.html'; });

            if (!tg.initData) tg.initData = "query_id=TEST";
            
            // حذف لودینگ کلاس بادی
            document.body.classList.remove('loading-active');
            
            fetchRates();
        };

        // مدیریت تب‌ها
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'buy-mode', 'sell-mode');
            });
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
            
            if(tab === 'buy') {
                const btn = document.querySelector('.tab-btn:nth-child(1)');
                btn.classList.add('active', 'buy-mode');
                document.getElementById('buy-section').classList.add('active');
            } else {
                const btn = document.querySelector('.tab-btn:nth-child(2)');
                btn.classList.add('active', 'sell-mode');
                document.getElementById('sell-section').classList.add('active');
            }
        }

        async function fetchRates() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; rates.sell = data.sell;
                    document.getElementById('rate-buy').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-sell').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) {}
        }

        function calcPrice() {
            const val = parseFloat(document.getElementById('buy-amount').value);
            if(val > 0 && rates.buy > 0) {
                const total = val * rates.buy;
                document.getElementById('buy-total').innerText = parseInt(total).toLocaleString() + " تومان";
            } else {
                document.getElementById('buy-total').innerText = "0 T";
            }
        }

        async function doBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const btn = document.getElementById('btn-do-buy');
            
            if(!amount || amount < 1) { tg.showAlert("حداقل خرید ۱ دلار است."); return; }

            btn.disabled = true; btn.style.opacity = "0.7"; btn.innerHTML = '<span>پردازش...</span>';
            document.getElementById('buy-result').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount_usd: amount })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('new-voucher-code').innerText = data.voucher_code;
                    document.getElementById('buy-result').style.display = 'block';
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }
            
            btn.disabled = false; btn.style.opacity = "1"; btn.innerHTML = '<span>خرید آنی</span> <i class="fas fa-bolt"></i>';
        }

        async function doSell() {
            const code = document.getElementById('sell-code').value.trim();
            const btn = document.getElementById('btn-do-sell');
            
            if(code.length < 10) { tg.showAlert("کد نامعتبر است."); return; }

            btn.disabled = true; btn.style.opacity = "0.7"; btn.innerHTML = '<span>استعلام...</span>';

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/utopia/sell`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, voucher_code: code })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`✅ فروخته شد!\nمبلغ ${parseInt(data.amount_toman).toLocaleString()} تومان واریز شد.`);
                    document.getElementById('sell-code').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }

            btn.disabled = false; btn.style.opacity = "1"; btn.innerHTML = '<span>نقد کردن</span> <i class="fas fa-arrow-down"></i>';
        }

        function copyCode() {
            const code = document.getElementById('new-voucher-code').innerText;
            navigator.clipboard.writeText(code);
            tg.showAlert("کد کپی شد!");
        }
    </script>
</body>
</html>
