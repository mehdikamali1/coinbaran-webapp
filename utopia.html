<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080E13">
    <title>خرید و فروش یوتوپیا | کوین باران</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-style.css?v=110.1">
    
    <style>
        /* استایل‌های اختصاصی صفحه یوتوپیا */
        .exchange-card {
            background: linear-gradient(145deg, rgba(20, 30, 40, 0.6) 0%, rgba(5, 10, 15, 0.8) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px 20px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .logo-header {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
        }
        .utopia-glow-img {
            width: 80px; height: 80px; object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(212, 0, 245, 0.4)); /* درخشش بنفش یوتوپیا */
            animation: floatLogo 6s ease-in-out infinite;
        }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        /* نرخ‌نما */
        .rates-bar {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px 15px;
            border: 1px solid var(--glass-border); margin-bottom: 20px;
        }
        .rate-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .rate-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
        .rate-value { font-family: 'Roboto Mono'; font-weight: 700; font-size: 1rem; }
        .c-buy { color: var(--neon-cyan); }
        .c-sell { color: #D400F5; } /* بنفش برای فروش */

        /* سوئیچ خرید و فروش */
        .trade-tabs {
            display: flex; background: rgba(255,255,255,0.02); border-radius: 14px; padding: 4px;
            margin-bottom: 25px; border: 1px solid var(--glass-border);
        }
        .trade-tab {
            flex: 1; padding: 10px; text-align: center; font-size: 0.9rem; font-weight: 700;
            color: var(--text-muted); cursor: pointer; transition: 0.3s; border-radius: 10px;
        }
        .trade-tab.active-buy {
            background: rgba(0, 245, 212, 0.15); color: var(--neon-cyan);
            border: 1px solid rgba(0, 245, 212, 0.2);
        }
        .trade-tab.active-sell {
            background: rgba(212, 0, 245, 0.15); color: #D400F5;
            border: 1px solid rgba(212, 0, 245, 0.2);
        }

        /* اینپوت‌های ماشین حساب */
        .calc-box {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 15px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .calc-input {
            background: transparent; border: none; color: #fff; font-family: 'Roboto Mono';
            font-size: 1.3rem; font-weight: 700; width: 100%; outline: none;
        }
        .calc-unit {
            font-size: 0.8rem; color: var(--text-muted); background: rgba(0,0,0,0.3);
            padding: 5px 10px; border-radius: 8px; white-space: nowrap; margin-right: 10px;
        }
        
        /* دکمه اکشن */
        .btn-trade {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-buy {
            background: linear-gradient(135deg, var(--neon-cyan), var(--deep-ocean)); color: #000;
            box-shadow: 0 5px 20px rgba(0, 245, 212, 0.2);
        }
        .btn-sell {
            background: linear-gradient(135deg, #D400F5, #8E2DE2); color: #fff;
            box-shadow: 0 5px 20px rgba(212, 0, 245, 0.2);
        }
        .btn-trade:active { transform: scale(0.96); }

        /* ووچر باکس (برای فروش) */
        .voucher-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px dashed var(--glass-border);
            border-radius: 16px; padding: 15px; color: #fff; font-family: 'Roboto Mono';
            font-size: 0.9rem; text-align: center; margin-bottom: 15px; resize: none;
        }
        .voucher-input:focus { border-color: var(--neon-cyan); background: rgba(0, 245, 212, 0.05); }

        /* باکس نتیجه موفق */
        .success-box {
            display: none; background: rgba(0,0,0,0.6); border: 1px dashed var(--neon-cyan);
            padding: 20px; border-radius: 16px; margin-top: 20px; text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .code-display {
            font-family: 'Roboto Mono'; font-size: 1.1rem; color: #fff;
            background: rgba(0, 245, 212, 0.1); padding: 12px; border-radius: 10px;
            margin: 10px 0; word-break: break-all; select-all;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body class="theme-ocean">

    <div class="ambient-glow top-glow" style="background: #D400F5;"></div>
    <div class="noise-texture"></div>

    <div class="app-header crystal-glass">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-ticket-alt" style="color: #D400F5; font-size: 1.2rem;"></i>
            <span style="font-weight: 800; font-size: 1rem;">یوتوپیا (UUSD)</span>
        </div>
        <button class="notif-btn" onclick="window.location.href='dashboard.html'" style="background: rgba(255,255,255,0.05);">
            <i class="fas fa-arrow-left"></i>
        </button>
    </div>

    <main class="content-scroll" style="padding-bottom: 100px;">
        
        <div class="exchange-card animate-in delay-1">
            
            <div class="logo-header">
                <img src="images/utopia_logo.png" class="utopia-glow-img" alt="Utopia Logo">
            </div>

            <div class="rates-bar">
                <div class="rate-item">
                    <span class="rate-label">نرخ خرید (از ما)</span>
                    <span class="rate-value c-buy" id="rate-buy">...</span>
                </div>
                <div style="width:1px; background:var(--glass-border);"></div>
                <div class="rate-item">
                    <span class="rate-label">نرخ فروش (به ما)</span>
                    <span class="rate-value c-sell" id="rate-sell">...</span>
                </div>
            </div>

            <div class="trade-tabs">
                <div id="tab-buy" class="trade-tab active-buy" onclick="switchTab('buy')">خرید ووچر</div>
                <div id="tab-sell" class="trade-tab" onclick="switchTab('sell')">فروش ووچر</div>
            </div>

            <div id="form-container">
                
                <div id="buy-section">
                    <div class="calc-box">
                        <input type="number" id="buy-amount" class="calc-input" placeholder="10" oninput="calcPrice()">
                        <span class="calc-unit">UUSD</span>
                    </div>
                    
                    <div style="text-align: center; margin: -10px 0 5px; opacity: 0.5;"><i class="fas fa-arrow-down"></i></div>
                    
                    <div class="calc-box" style="background: rgba(0,0,0,0.5);">
                        <input type="text" id="buy-total" class="calc-input" placeholder="0" readonly style="color: var(--neon-cyan);">
                        <span class="calc-unit">تومان</span>
                    </div>

                    <button id="btn-do-buy" class="btn-trade btn-buy" onclick="doBuy()">
                        <i class="fas fa-shopping-cart"></i> خرید آنی
                    </button>

                    <div id="buy-result" class="success-box">
                        <div style="color:var(--neon-cyan); font-weight:800; margin-bottom:10px">✅ خرید موفق!</div>
                        <div style="font-size:0.8rem; color:#aaa">کد ووچر شما:</div>
                        <div id="new-voucher-code" class="code-display">...</div>
                        <button onclick="copyCode()" class="ripple-btn" style="background:transparent; border:1px solid #fff; color:#fff; padding:6px 20px; border-radius:15px; font-size:0.8rem;">کپی کد</button>
                    </div>
                </div>

                <div id="sell-section" style="display: none;">
                    <textarea id="sell-code" class="voucher-input" rows="3" placeholder="کد ووچر یوتوپیا را اینجا وارد کنید...&#10;مثال: UTP-..."></textarea>
                    
                    <div style="background:rgba(212, 0, 245, 0.1); border:1px dashed #D400F5; border-radius:12px; padding:15px; text-align:center; margin-bottom: 15px;">
                        <p style="margin:0; font-size:0.8rem; color:#eee;">سیستم به صورت خودکار ووچر را نقد می‌کند.</p>
                    </div>

                    <button id="btn-do-sell" class="btn-trade btn-sell" onclick="doSell()">
                        <i class="fas fa-exchange-alt"></i> نقد کردن ووچر
                    </button>
                </div>

            </div>

        </div>

    </main>

    <nav class="bottom-nav crystal-glass animate-in delay-2">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>خانه</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>کیف پول</span>
        </a>
        <a href="#" class="nav-item floating-btn">
            <div class="float-inner ocean-gradient"><i class="fas fa-exchange-alt"></i></div>
        </a>
        <a href="game.html" class="nav-item">
            <i class="fas fa-gamepad"></i>
            <span>بازی</span>
        </a>
        <a href="support.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>پشتیبانی</span>
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin + "/api"; // مسیر عمومی API
        let rates = { buy: 0, sell: 0 };

        window.onload = function() {
            tg.ready(); tg.expand(); 
            tg.setHeaderColor('#080E13'); // رنگ هدر تم جدید
            if (!tg.initData) tg.initData = "query_id=TEST_DEV";
            fetchRates();
        };

        function switchTab(tab) {
            // تغییر استایل تب‌ها
            document.getElementById('tab-buy').className = `trade-tab ${tab === 'buy' ? 'active-buy' : ''}`;
            document.getElementById('tab-sell').className = `trade-tab ${tab === 'sell' ? 'active-sell' : ''}`;
            
            // تغییر محتوا
            if(tab === 'buy') {
                document.getElementById('buy-section').style.display = 'block';
                document.getElementById('sell-section').style.display = 'none';
            } else {
                document.getElementById('buy-section').style.display = 'none';
                document.getElementById('sell-section').style.display = 'block';
            }
            
            if(window.Telegram) tg.HapticFeedback.impactOccurred('light');
        }

        async function fetchRates() {
            try {
                // آدرس قبلی: webapp/utopia/rates
                const res = await fetch(`${window.location.origin}/api/webapp/utopia/rates`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    rates.buy = data.buy; rates.sell = data.sell;
                    document.getElementById('rate-buy').innerText = parseInt(rates.buy).toLocaleString();
                    document.getElementById('rate-sell').innerText = parseInt(rates.sell).toLocaleString();
                }
            } catch(e) {}
        }

        function calcPrice() {
            const val = parseFloat(document.getElementById('buy-amount').value);
            if(val > 0 && rates.buy > 0) {
                const total = val * rates.buy;
                document.getElementById('buy-total').value = parseInt(total).toLocaleString();
            } else {
                document.getElementById('buy-total').value = "0";
            }
        }

        async function doBuy() {
            const amount = parseFloat(document.getElementById('buy-amount').value);
            const btn = document.getElementById('btn-do-buy');
            
            if(!amount || amount < 1) { tg.showAlert("حداقل خرید ۱ دلار است."); return; }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> پردازش...';
            document.getElementById('buy-result').style.display = 'none';

            try {
                const res = await fetch(`${window.location.origin}/api/webapp/utopia/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, amount_usd: amount })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('new-voucher-code').innerText = data.voucher_code;
                    document.getElementById('buy-result').style.display = 'block';
                    tg.showAlert("✅ خرید موفقیت آمیز بود");
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }
            
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-shopping-cart"></i> خرید آنی';
        }

        async function doSell() {
            const code = document.getElementById('sell-code').value.trim();
            const btn = document.getElementById('btn-do-sell');
            
            if(code.length < 5) { tg.showAlert("کد نامعتبر است."); return; }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال استعلام...';

            try {
                const res = await fetch(`${window.location.origin}/api/webapp/utopia/sell`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData, voucher_code: code })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`✅ فروخته شد!\nمبلغ ${parseInt(data.amount_toman).toLocaleString()} تومان واریز شد.`);
                    document.getElementById('sell-code').value = "";
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("❌ " + data.message);
                }
            } catch(e) { tg.showAlert("خطای شبکه"); }

            btn.disabled = false; btn.innerHTML = '<i class="fas fa-exchange-alt"></i> نقد کردن ووچر';
        }

        function copyCode() {
            const code = document.getElementById('new-voucher-code').innerText;
            navigator.clipboard.writeText(code);
            tg.showAlert("کد کپی شد!");
        }
    </script>

</body>
</html>
