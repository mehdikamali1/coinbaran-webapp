<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080E13">
    <title>ووچر یوتوپیا | کوین باران</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --accent-turquoise: #00F5D4;
            --accent-blue: #00BBFF;
            --accent-purple: #9b51e0;
            --bg-deep: #020617;
            --card-glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #94a3b8;
        }

        /* جلوگیری از اسکرول عرضی */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        html, body {
            margin: 0; padding: 0;
            width: 100% !important;
            max-width: 100vw !important;
            overflow-x: hidden !important;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Vazirmatn', sans-serif;
            position: relative;
        }

        /* --- Header --- */
        .luxury-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
        }

        .header-content { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            width: 38px; height: 38px; border-radius: 12px;
            background: var(--card-glass); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-turquoise); cursor: pointer;
        }

        .header-title h1 {
            margin: 0; font-size: 1.1rem; font-weight: 900;
            background: linear-gradient(90deg, var(--accent-turquoise), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Container --- */
        .container {
            padding: 20px; width: 100%; max-width: 500px; margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Price Card --- */
        .price-ticker {
            background: var(--card-glass); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px; position: relative;
        }

        .price-ticker::after { content: ''; position: absolute; top: 25%; left: 50%; width: 1px; height: 50%; background: var(--glass-border); }
        .ticker-item { text-align: center; }
        .ticker-label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; }
        .ticker-val { font-family: 'Roboto Mono', monospace; font-size: 1.1rem; font-weight: 800; }
        .val-buy { color: var(--accent-turquoise); }
        .val-sell { color: var(--accent-purple); }

        /* --- Tabs --- */
        .mode-tabs {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 5px; display: flex; margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1; padding: 12px; text-align: center; border-radius: 16px;
            font-weight: 800; font-size: 0.85rem; color: var(--text-muted);
            cursor: pointer; transition: 0.3s;
        }

        .tab-btn.active.buy { background: var(--accent-turquoise); color: #000; box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3); }
        .tab-btn.active.sell { background: var(--accent-purple); color: #fff; box-shadow: 0 4px 15px rgba(155, 81, 224, 0.3); }

        /* --- Panel --- */
        .glass-card {
            background: var(--card-glass); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 25px; backdrop-filter: blur(10px); margin-bottom: 20px;
        }

        .input-group { margin-bottom: 25px; }
        .inp-label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; font-weight: 700; }

        .luxury-input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1.5px solid var(--glass-border);
            border-radius: 18px; padding: 18px; color: #fff; font-size: 1.1rem;
            font-weight: 700; font-family: 'Roboto Mono', monospace; text-align: left; direction: ltr;
        }

        .luxury-input:focus { border-color: var(--accent-turquoise); background: rgba(0, 0, 0, 0.6); }

        .calc-display {
            background: rgba(0, 245, 212, 0.05); border-radius: 18px; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .calc-res { font-family: 'Roboto Mono'; font-weight: 900; font-size: 1.2rem; color: var(--accent-turquoise); }

        .disclaimer-box {
            background: rgba(246, 70, 93, 0.05); border: 1px solid rgba(246, 70, 93, 0.2);
            border-radius: 16px; padding: 15px; margin-bottom: 20px; font-size: 0.75rem; line-height: 1.6; color: #fca5a5;
        }

        .action-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem;
            font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s;
        }
        .btn-buy { background: linear-gradient(135deg, var(--accent-turquoise), var(--accent-blue)); color: #000; }
        .btn-sell { background: linear-gradient(135deg, var(--accent-purple), #7b61ff); color: #fff; }
        .action-btn:active { transform: scale(0.96); }

        /* --- Modals --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 25px;
        }
        .overlay.active { display: flex; }
        .modal {
            background: #0f172a; border: 1px solid var(--glass-border); border-radius: 35px;
            padding: 40px 30px; width: 100%; max-width: 400px; text-align: center;
        }
        .modal-icon { font-size: 2.5rem; margin-bottom: 20px; }
        .voucher-reveal {
            background: #000; padding: 15px; border-radius: 14px; font-family: 'Roboto Mono';
            color: var(--accent-turquoise); font-size: 1rem; margin: 20px 0; border: 1px dashed var(--accent-turquoise); word-break: break-all;
        }
        .close-btn { width: 100%; padding: 15px; border-radius: 15px; background: var(--card-glass); color: #fff; font-weight: 800; cursor: pointer; border: 1px solid var(--glass-border); margin-top: 10px; }

    </style>
</head>
<body>

    <header class="luxury-header">
        <div class="header-content">
            <div class="back-btn" onclick="window.location.href='/dashboard'"><i class="fas fa-chevron-right"></i></div>
            <div class="header-title"><h1>ووچر یوتوپیا (UUSD)</h1></div>
        </div>
        <div style="color: var(--accent-purple); font-size: 1.2rem;"><i class="fas fa-shield-halved"></i></div>
    </header>

    <div class="container">
        <div class="price-ticker">
            <div class="ticker-item">
                <span class="ticker-label">خرید ما از شما</span>
                <span class="ticker-val val-sell" id="rate-buy">---</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-label">فروش ما به شما</span>
                <span class="ticker-val val-buy" id="rate-sell">---</span>
            </div>
        </div>

        <div class="mode-tabs">
            <div id="tab-buy" class="tab-btn active buy" onclick="switchMode('buy')">صدور آنی ووچر</div>
            <div id="tab-sell" class="tab-btn sell" onclick="switchMode('sell')">نقد کردن ووچر</div>
        </div>

        <div id="buy-section" class="mode-content">
            <div class="glass-card">
                <div class="disclaimer-box">
                    <i class="fas fa-circle-exclamation"></i>
                    ووچر صادر شده غیرقابل ابطال است. لطفاً در حفظ کد آن کوشا باشید.
                </div>
                <div class="input-group">
                    <label class="inp-label">مقدار مورد نیاز (UUSD)</label>
                    <input type="number" id="buy-amount" class="luxury-input" placeholder="0.00" oninput="calc('buy')">
                </div>
                <div class="calc-display">
                    <span class="inp-label" style="margin:0">هزینه نهایی:</span>
                    <span class="calc-res" id="buy-total">0 تومان</span>
                </div>
                <button class="action-btn btn-buy" onclick="handleBuy()"><i class="fas fa-bolt"></i> پرداخت و صدور ووچر</button>
            </div>
        </div>

        <div id="sell-section" class="mode-content" style="display: none;">
            <div class="glass-card">
                <div class="input-group">
                    <label class="inp-label">کد ووچر یوتوپیا</label>
                    <input type="text" id="sell-code" class="luxury-input" placeholder="UUSD-XXXX-XXXX" style="font-size: 0.9rem;">
                </div>
                <div class="calc-display" style="background: rgba(155, 81, 224, 0.05);">
                    <span class="inp-label" style="margin:0">مبلغ دریافتی:</span>
                    <span class="calc-res" id="sell-total" style="color: var(--accent-purple);">0 تومان</span>
                </div>
                <button class="action-btn btn-sell" onclick="handleSell()"><i class="fas fa-sack-dollar"></i> تایید و شارژ کیف پول</button>
            </div>
        </div>
    </div>

    <div id="status-overlay" class="overlay">
        <div class="modal">
            <div id="m-icon" class="modal-icon"><i class="fas fa-circle-notch fa-spin" style="color: var(--accent-blue);"></i></div>
            <h2 id="m-title">در حال پردازش</h2>
            <div id="m-body" style="color: var(--text-muted); line-height: 1.6; margin-bottom: 10px;"></div>
            <div id="voucher-display" class="voucher-reveal" style="display: none;"></div>
            <button id="m-close" onclick="hideModal()" style="display: none;" class="close-btn">متوجه شدم</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_URL = window.location.origin + "/api/webapp/utopia";
        let rates = { buy: 0, sell: 0 };

        window.onload = async () => {
            tg.ready(); tg.expand();
            await fetchRates();
        };

        async function fetchRates() {
            try {
                const r = await fetch(`${API_URL}/rates`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ initData: tg.initData }) });
                const d = await r.json();
                if(d.status === 'success') {
                    rates = { buy: d.buy_price, sell: d.sell_price };
                    document.getElementById('rate-buy').innerText = d.sell_price.toLocaleString();
                    document.getElementById('rate-sell').innerText = d.buy_price.toLocaleString();
                }
            } catch(e) { console.error("Rate Error"); }
        }

        function switchMode(m) {
            const isB = m === 'buy';
            document.getElementById('buy-section').style.display = isB ? 'block' : 'none';
            document.getElementById('sell-section').style.display = isB ? 'none' : 'block';
            document.getElementById('tab-buy').className = `tab-btn ${isB ? 'active buy' : ''}`;
            document.getElementById('tab-sell').className = `tab-btn ${!isB ? 'active sell' : ''}`;
            tg.HapticFeedback.impactOccurred('medium');
        }

        function calc(m) {
            const amt = parseFloat(document.getElementById('buy-amount').value || 0);
            document.getElementById('buy-total').innerText = Math.floor(amt * rates.sell).toLocaleString() + ' تومان';
        }

        function showStatus(title, body, type='loading') {
            const o = document.getElementById('status-overlay');
            const i = document.getElementById('m-icon');
            const b = document.getElementById('m-close');
            o.classList.add('active');
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-body').innerText = body;
            if(type === 'loading') { i.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="color: var(--accent-blue);"></i>'; b.style.display = 'none'; }
            else if(type === 'success') { i.innerHTML = '<i class="fas fa-check-circle" style="color: var(--accent-turquoise);"></i>'; b.style.display = 'block'; }
            else { i.innerHTML = '<i class="fas fa-times-circle" style="color: #f6465d;"></i>'; b.style.display = 'block'; }
        }

        function hideModal() { document.getElementById('status-overlay').classList.remove('active'); if(document.getElementById('m-title').innerText.includes("موفق")) location.reload(); }

        async function handleBuy() {
            const amt = parseFloat(document.getElementById('buy-amount').value);
            if(!amt || amt < 1) return tg.showAlert("❌ حداقل مقدار ۱ UUSD است.");
            showStatus("در حال صدور", "ارتباط با شبکه یوتوپیا...");
            try {
                const r = await fetch(`${API_URL}/buy`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ initData: tg.initData, amount: amt }) });
                const d = await r.json();
                if(d.status === 'success') {
                    document.getElementById('voucher-display').innerText = d.voucher_code;
                    document.getElementById('voucher-display').style.display = 'block';
                    showStatus("صدور موفقیت‌آمیز", "کد ووچر شما آماده استفاده است:", "success");
                    tg.HapticFeedback.notificationOccurred('success');
                } else showStatus("خطا", d.message, "error");
            } catch(e) { showStatus("خطای فنی", "عدم اتصال به سرور.", "error"); }
        }

        async function handleSell() {
            const code = document.getElementById('sell-code').value.trim();
            if(code.length < 8) return tg.showAlert("❌ کد ووچر معتبر نیست.");
            showStatus("در حال استعلام", "بررسی صحت ووچر در شبکه...");
            try {
                const r = await fetch(`${API_URL}/sell`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ initData: tg.initData, voucher_code: code }) });
                const d = await r.json();
                if(d.status === 'success') {
                    showStatus("نقد شد!", `مبلغ ${d.amount_toman.toLocaleString()} تومان به کیف پول شما اضافه شد.`, "success");
                    tg.HapticFeedback.notificationOccurred('success');
                } else showStatus("خطا در نقد کردن", d.message, "error");
            } catch(e) { showStatus("خطای فنی", "اختلال در شبکه یوتوپیا.", "error"); }
        }
    </script>
</body>
</html>
