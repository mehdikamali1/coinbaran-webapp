<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صرافی یوتوپیا</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/global.css?v=1.0">
    <link rel="stylesheet" href="webapp/utopia-style.css?v=1.0">
    
</head>
<body>

    <div class="ambient-glow glow-top" style="background:var(--utopia-pink)"></div>
    <div class="scanlines"></div>

    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn" onclick="window.location.href='/'"><i class="fas fa-arrow-right"></i></div>
            <div style="font-weight:800; font-size:1.1rem">صرافی <span style="color:var(--utopia-pink)">یوتوپیا</span></div>
        </div>
        <div style="width:40px"></div>
    </header>

    <div class="glass-wrapper main-scroll-area">
        
        <div class="utopia-ticker">
            <div class="tick-item">
                <span class="tick-label">خرید (از شما)</span>
                <span class="tick-val c-buy" id="rate-sell">...</span>
            </div>
            <div style="width:1px; background:rgba(255,255,255,0.1)"></div>
            <div class="tick-item" style="align-items:flex-end">
                <span class="tick-label">فروش (به شما)</span>
                <span class="tick-val c-sell" id="rate-buy">...</span>
            </div>
        </div>

        <div class="u-tabs">
            <div class="u-tab active" onclick="switchTab('buy')">خرید ووچر</div>
            <div class="u-tab" onclick="switchTab('sell')">فروش ووچر</div>
        </div>

        <div id="buy-section" class="section-box active">
            <div style="margin-bottom:20px;">
                <label style="display:block; color:var(--text-muted); margin-bottom:8px; font-size:0.9rem;">مقدار (دلار):</label>
                <input type="number" id="buy-amount" class="glass-inp" placeholder="10" oninput="calcPrice()">
            </div>
            <div style="display:flex; justify-content:space-between; padding:0 10px;">
                <span style="color:var(--text-muted); font-size:0.9rem;">مبلغ قابل پرداخت:</span>
                <span id="buy-total" style="color:var(--gold-primary); font-weight:bold; font-family:monospace;">0</span>
            </div>

            <button id="btn-do-buy" class="btn-pink" onclick="doBuy()">
                <i class="fas fa-shopping-cart"></i> خرید آنی
            </button>
            
            <div id="buy-result" style="display:none; background:#000; border:1px dashed var(--utopia-pink); padding:20px; border-radius:16px; margin-top:20px; text-align:center;">
                <div style="color:var(--accent-green); font-weight:800; margin-bottom:10px">✅ خرید موفق!</div>
                <div style="font-size:0.8rem; color:var(--text-muted); opacity:0.8;">کد ووچر شما:</div>
                <div id="new-voucher-code" style="font-family:monospace; font-size:1.1rem; color:var(--text-main); background:rgba(255,0,122,0.1); padding:10px; border-radius:8px; margin:10px 0; word-break:break-all;">...</div>
                <button onclick="copyCode()" style="background:transparent; border:1px solid var(--text-main); color:var(--text-main); padding:5px 15px; border-radius:15px;">کپی</button>
            </div>
        </div>

        <div id="sell-section" class="section-box">
            <div style="margin-bottom:20px;">
                <label style="display:block; color:var(--text-muted); margin-bottom:8px; font-size:0.9rem;">کد ووچر:</label>
                <input type="text" id="sell-code" class="glass-inp" placeholder="UTP...">
            </div>
            
            <div style="background:rgba(14, 203, 129, 0.1); border:1px dashed var(--accent-green); border-radius:12px; padding:15px; text-align:center;">
                <p style="margin:0; font-size:0.8rem; color:var(--text-main); opacity:0.9;">سیستم به صورت خودکار ووچر را نقد می‌کند.</p>
            </div>

            <button id="btn-do-sell" class="btn-green" onclick="doSell()">
                <i class="fas fa-exchange-alt"></i> نقد کردن
            </button>
        </div>

    </div>

    <script src="webapp/utopia.js?v=1.0"></script>
</body>
</html>
