<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>مدیریت دارایی | کوین باران</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-style.css?v=100.1">
    
    <style>
        /* استایل‌های اختصاصی صفحه کیف پول (Overrides) */
        .wallet-nav-tabs {
            display: flex; gap: 8px; margin: 0 0 20px;
            background: rgba(255,255,255,0.03); padding: 5px; border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        .tab-item {
            flex: 1; padding: 10px; text-align: center; font-size: 0.75rem;
            color: #888; border-radius: 12px; cursor: pointer; transition: all 0.3s;
            font-weight: 600;
        }
        .tab-item.active {
            background: var(--gold); color: #000; box-shadow: 0 4px 12px rgba(255,215,0,0.2);
        }
        
        .panel-section { display: none; animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .panel-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .luxe-input-group { margin-bottom: 20px; }
        .luxe-label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 8px; margin-right: 5px; }
        .luxe-field {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; color: #fff; font-size: 1rem;
            font-family: 'Roboto Mono', 'Vazirmatn'; transition: 0.3s;
        }
        .luxe-field:focus { border-color: var(--gold); background: rgba(0,0,0,0.5); }
        
        /* استایل دکمه‌های بزرگ */
        .action-btn-large {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: transform 0.2s;
        }
        .btn-gold { background: var(--gold); color: #000; box-shadow: 0 8px 20px rgba(255,215,0,0.2); }
        .btn-glass { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); }
        .action-btn-large:active { transform: scale(0.96); }

        .smart-details-box {
            background: linear-gradient(180deg, rgba(255,215,0,0.05), transparent);
            border: 1px solid rgba(255,215,0,0.2); border-radius: 20px; padding: 20px;
            margin-top: 20px; text-align: center;
        }
        .copy-row {
            background: rgba(0,0,0,0.4); border-radius: 12px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin: 10px 0; border: 1px solid var(--glass-border);
        }
        .copy-val { font-family: 'Roboto Mono'; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }
        .copy-icon { color: var(--gold); cursor: pointer; padding: 5px; }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px;
            padding: 30px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .upload-area:hover { border-color: var(--gold); background: rgba(255,215,0,0.02); }
        
        /* هدر ساده برای صفحات داخلی */
        .page-header {
            padding: 20px; font-size: 1.2rem; font-weight: 800; color: #fff;
            text-align: center; border-bottom: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="ambient-glow top-glow"></div>
    <div class="page-header">مدیریت کیف پول</div>

    <main class="content-scroll" style="padding-bottom: 100px;">
        
        <div class="hero-card" style="padding: 20px; margin-bottom: 20px;">
            <div class="card-glass-effect"></div>
            <div class="card-top" style="margin-bottom: 5px;">
                <span class="card-label">موجودی قابل برداشت</span>
                <i class="fas fa-wallet" style="color:rgba(255,255,255,0.2); font-size: 1.2rem;"></i>
            </div>
            <div class="balance-wrapper">
                <span class="currency-sign">T</span>
                <h1 id="balance-toman">---</h1>
            </div>
        </div>

        <div class="wallet-nav-tabs">
            <div id="nav-auto" class="tab-item active" onclick="showPanel('auto')">واریز سریع</div>
            <div id="nav-withdraw" class="tab-item" onclick="showPanel('withdraw')">برداشت</div>
            <div id="nav-addcard" class="tab-item" onclick="showPanel('addcard')">کارت‌ها</div>
            <div id="nav-manual" class="tab-item" onclick="showPanel('manual')">فیش</div>
        </div>

        <div id="panel-auto" class="panel-section active">
            <div class="luxe-input-group">
                <label class="luxe-label">مبلغ شارژ (تومان)</label>
                <input type="text" id="auto-amount-input" class="luxe-field" placeholder="مثلاً ۵۰۰,۰۰۰" inputmode="numeric">
            </div>
            <button class="action-btn-large btn-gold" onclick="generateSmartPayment()">
                <i class="fas fa-bolt"></i> دریافت شناسه پرداخت
            </button>

            <div id="smart-payment-details" class="smart-details-box" style="display: none;">
                <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:15px;">مبلغ زیر را دقیقاً واریز کنید:</p>
                
                <div class="copy-row">
                    <span class="luxe-label">مبلغ (ریال):</span>
                    <span id="smart-rial-value" class="copy-val">---</span>
                    <i class="far fa-copy copy-icon" onclick="copyValue('smart-rial-value', 'مبلغ کپی شد')"></i>
                </div>
                
                <div class="copy-row">
                    <span class="luxe-label">کارت مقصد:</span>
                    <span id="smart-card-num" class="copy-val" style="font-size:0.9rem">---</span>
                    <i class="far fa-copy copy-icon" onclick="copyValue('smart-card-num', 'شماره کارت کپی شد')"></i>
                </div>

                <div class="copy-row" style="background:rgba(14,203,129,0.1); border-color:var(--green);">
                    <span class="luxe-label" style="color:var(--green)">شناسه:</span>
                    <span id="smart-toman-display" class="copy-val" style="color:var(--green)">---</span>
                </div>

                <button class="action-btn-large btn-glass" style="margin-top:15px; font-size:0.9rem;" onclick="resetSmartPanel()">
                    بازگشت و تغییر مبلغ
                </button>
            </div>
        </div>

        <div id="panel-withdraw" class="panel-section">
            <div class="luxe-input-group">
                <label class="luxe-label">مبلغ برداشت (تومان)</label>
                <input type="text" id="withdraw-amount-input" class="luxe-field" placeholder="حداقل ۱۰۰,۰۰۰" inputmode="numeric">
            </div>
            <div class="luxe-input-group">
                <label class="luxe-label">کارت مقصد</label>
                <select id="withdraw-card-select" class="luxe-field" style="background-color: #111;">
                    <option value="" disabled selected>در حال بارگذاری...</option>
                </select>
            </div>
            <button class="action-btn-large btn-glass" onclick="requestWithdrawal()">
                <i class="fas fa-paper-plane"></i> ثبت درخواست تسویه
            </button>
        </div>

        <div id="panel-addcard" class="panel-section">
            <div class="luxe-input-group">
                <label class="luxe-label">شماره کارت (۱۶ رقم)</label>
                <input type="text" id="new-card-number" class="luxe-field" placeholder="----  ----  ----  ----" maxlength="16" inputmode="numeric">
            </div>
            <div class="luxe-input-group">
                <label class="luxe-label">نام بانک</label>
                <input type="text" id="new-bank-name" class="luxe-field" placeholder="مثلاً: ملی">
            </div>
            <div class="luxe-input-group">
                <label class="luxe-label">تصویر روی کارت</label>
                <div class="upload-area" onclick="document.getElementById('card-image-file').click()">
                    <i class="fas fa-camera" style="font-size: 2rem; color: var(--gold); margin-bottom: 10px;"></i>
                    <div id="card-image-label" style="font-size: 0.8rem; color: #888;">لمس برای انتخاب عکس</div>
                    <input type="file" id="card-image-file" style="display:none" accept="image/*" onchange="handleCardImageSelect()">
                </div>
            </div>
            <button class="action-btn-large btn-gold" onclick="submitNewCard()">
                <i class="fas fa-plus"></i> ثبت کارت
            </button>
        </div>

        <div id="panel-manual" class="panel-section">
            <div class="luxe-input-group">
                <label class="luxe-label">مبلغ واریزی (تومان)</label>
                <input type="text" id="manual-amount-input" class="luxe-field" placeholder="مبلغ دقیق فیش" inputmode="numeric">
            </div>
            <div class="luxe-input-group">
                <label class="luxe-label">تصویر فیش واریزی</label>
                <div class="upload-area" onclick="document.getElementById('receipt-file').click()">
                    <i class="fas fa-receipt" style="font-size: 2rem; color: var(--blue); margin-bottom: 10px;"></i>
                    <div id="file-name-label" style="font-size: 0.8rem; color: #888;">انتخاب تصویر فیش</div>
                    <input type="file" id="receipt-file" style="display:none" accept="image/*" onchange="handleFileSelect()">
                </div>
            </div>
            <button class="action-btn-large btn-glass" onclick="submitManualDeposit()">
                <i class="fas fa-check"></i> ارسال جهت بررسی
            </button>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <i class="fas fa-home"></i>
            <span>خانه</span>
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-wallet"></i>
            <span>کیف پول</span>
        </a>
        <a href="usdt.html" class="nav-item floating-btn">
            <div class="float-inner"><i class="fas fa-exchange-alt"></i></div>
        </a>
        <a href="game.html" class="nav-item">
            <i class="fas fa-gamepad"></i>
            <span>بازی</span>
        </a>
        <a href="support.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>پشتیبانی</span>
        </a>
    </nav>

    <script src="webapp/wallet-engine.js"></script>
    
    <script>
        // تابع تغییر تب‌ها
        function showPanel(id) {
            // غیرفعال کردن همه تب‌ها
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            // فعال کردن تب انتخاب شده
            const activeNav = document.getElementById('nav-' + id);
            if(activeNav) activeNav.classList.add('active');
            
            // مخفی کردن همه پنل‌ها
            document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active'));
            // نمایش پنل انتخاب شده
            const activePanel = document.getElementById('panel-' + id);
            if(activePanel) activePanel.classList.add('active');
            
            // ویبره هپتیک
            if(window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        // تابع کپی (حفظ شده از قبل)
        function copyValue(elementId, message) {
            const element = document.getElementById(elementId);
            const text = element.innerText.replace(/,/g, '').replace(/-/g, '').replace(' تومان', '');
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => { 
                    if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.showAlert(message);
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus(); textArea.select();
                try { document.execCommand('copy'); if(window.Telegram) window.Telegram.WebApp.showAlert(message); } catch (err) {}
                document.body.removeChild(textArea);
            }
            if(window.Telegram) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }

        // توابع انتخاب فایل (بروزرسانی شده برای تغییر رنگ متن)
        function handleFileSelect() {
            const file = document.getElementById('receipt-file').files[0];
            if (file) {
                const lbl = document.getElementById('file-name-label');
                lbl.innerText = "✅ " + file.name;
                lbl.style.color = "var(--green)";
            }
        }

        function handleCardImageSelect() {
            const file = document.getElementById('card-image-file').files[0];
            if (file) {
                const lbl = document.getElementById('card-image-label');
                lbl.innerText = "✅ تصویر انتخاب شد";
                lbl.style.color = "var(--green)";
            }
        }
        
        // هندل کردن پارامتر URL برای باز کردن تب خاص (مثلا ?tab=withdraw)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab');
            if(tab && document.getElementById('nav-' + tab)) {
                showPanel(tab);
            }
        });
    </script>
</body>
</html>
