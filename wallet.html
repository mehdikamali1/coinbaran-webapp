<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مدیریت دارایی | کوین باران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=30.0">

    <style>
        /* استایل‌های اختصاصی تکمیلی برای کیف پول */
        .wallet-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-bottom: 25px;
        }
        .w-btn {
            padding: 18px; border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.2s;
        }
        .w-btn:active { transform: scale(0.96); }
        
        .btn-deposit { background: linear-gradient(135deg, rgba(14, 203, 129, 0.15) 0%, rgba(0,0,0,0) 100%); border-color: rgba(14, 203, 129, 0.3); }
        .btn-deposit i { color: var(--color-up); font-size: 1.5rem; }
        .btn-deposit span { color: var(--color-up); font-weight: 700; font-size: 0.9rem; }

        .btn-withdraw { background: linear-gradient(135deg, rgba(246, 70, 93, 0.15) 0%, rgba(0,0,0,0) 100%); border-color: rgba(246, 70, 93, 0.3); }
        .btn-withdraw i { color: var(--color-down); font-size: 1.5rem; }
        .btn-withdraw span { color: var(--color-down); font-weight: 700; font-size: 0.9rem; }

        /* لیست تراکنش‌ها */
        .tx-container { padding-bottom: 50px; }
        .tx-header { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; border-right: 3px solid var(--gold-primary); padding-right: 10px; }
        
        .tx-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; margin-bottom: 10px;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            cursor: pointer; transition: background 0.2s;
        }
        .tx-card:active { background: rgba(255,255,255,0.05); }

        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon-box {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; background: rgba(0,0,0,0.3);
        }
        .tx-details { display: flex; flex-direction: column; gap: 3px; }
        .tx-title { font-size: 0.9rem; font-weight: 700; color: #eee; }
        .tx-date { font-size: 0.7rem; color: #666; font-family: 'Vazirmatn'; }
        
        .tx-amount { font-family: monospace; font-weight: 800; font-size: 1rem; direction: ltr; }
        
        /* آپلود باکس */
        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 30px; text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .upload-area:active { background: rgba(255,255,255,0.02); border-color: var(--gold-primary); }
        .upload-icon { font-size: 2rem; color: var(--text-muted); margin-bottom: 10px; transition: color 0.3s; }
        .upload-label { font-size: 0.85rem; color: var(--text-muted); }
        
        /* ووچر باکس در جزئیات */
        .voucher-display {
            background: #000; padding: 15px; border-radius: 12px;
            border: 1px dashed var(--gold-primary);
            margin-top: 15px; text-align: center;
        }
        .v-code { font-family: monospace; font-size: 1.1rem; color: var(--gold-primary); letter-spacing: 1px; word-break: break-all; }

    </style>
</head>
<body>

    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="scanlines"></div>

    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn" onclick="window.location.href='/'">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div style="font-weight:800; font-size:1.1rem">مدیریت دارایی</div>
        </div>
        <div style="width:40px"></div>
    </header>

    <div class="glass-wrapper main-scroll-area">
        
        <div class="asset-card">
            <div class="card-shine-effect"></div>
            <div class="balance-display" style="text-align:center; margin:0; padding:10px 0;">
                <span class="label-muted">موجودی قابل برداشت</span>
                <div class="amount-row" style="justify-content:center; margin-top:10px;">
                    <h1 id="balance-toman" class="main-digit">---</h1>
                    <span class="currency-symbol">تومان</span>
                </div>
                <div id="balance-uusd" class="stat-value color-usd" style="margin-top:10px; font-size:1.1rem;">--- UUSD</div>
            </div>
        </div>

        <div class="wallet-actions">
            <div class="w-btn btn-deposit" onclick="openDepositModal()">
                <i class="fas fa-arrow-down"></i>
                <span>واریز تومان</span>
            </div>
            <div class="w-btn btn-withdraw">
                <i class="fas fa-arrow-up"></i>
                <span>برداشت وجه</span>
            </div>
        </div>

        <div class="tx-container">
            <div class="tx-header">تاریخچه تراکنش‌ها</div>
            <div id="tx-list">
                <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:0.9rem;">
                    <i class="fas fa-circle-notch fa-spin"></i> در حال دریافت اطلاعات...
                </div>
            </div>
        </div>

    </div>

    <div id="deposit-modal" class="glass-modal">
        <div class="modal-card">
            <div class="modal-title" style="color:var(--color-up)"><i class="fas fa-wallet"></i> شارژ کیف پول</div>
            <div class="modal-desc">لطفاً مبلغ واریزی و رسید پرداخت را وارد کنید.</div>

            <div style="margin-bottom:20px; text-align:right;">
                <label class="label-muted" style="margin-bottom:8px; display:block;">مبلغ به تومان:</label>
                <div style="position:relative;">
                    <input type="number" id="deposit-amount" class="glass-field" placeholder="مثلا 100000" style="padding-left:15px; text-align:center;">
                </div>
            </div>

            <div class="upload-area" onclick="document.getElementById('receipt-file').click()">
                <i class="fas fa-cloud-upload-alt upload-icon" id="up-icon"></i>
                <div class="upload-label" id="file-label">برای انتخاب تصویر فیش کلیک کنید</div>
                <input type="file" id="receipt-file" style="display:none" accept="image/*" onchange="updateFileLabel(this)">
            </div>

            <button id="btn-submit-dep" class="action-item" 
                style="width:100%; background:var(--color-up); color:#000; padding:15px; border-radius:12px; border:none; font-weight:800; margin-top:20px;" 
                onclick="submitDeposit()">
                تایید و ارسال
            </button>
            
            <button class="action-item" style="background:transparent; border:none; color:#666; margin-top:15px; font-size:0.8rem;" onclick="closeDepositModal()">انصراف</button>
        </div>
    </div>

    <div id="detail-modal" class="glass-modal">
        <div class="modal-card">
            <div class="modal-title">جزئیات تراکنش</div>
            <div id="detail-content" style="text-align:right; margin-top:20px;"></div>
            <button class="action-item" style="width:100%; background:#333; color:#fff; padding:12px; border-radius:12px; border:none; margin-top:20px;" 
                onclick="document.getElementById('detail-modal').classList.remove('active')">بستن</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;

        // Modal Functions
        function openDepositModal() { document.getElementById('deposit-modal').classList.add('active'); }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.remove('active'); }
        
        function updateFileLabel(input) {
            const label = document.getElementById('file-label');
            const icon = document.getElementById('up-icon');
            if (input.files && input.files.length > 0) {
                label.innerText = "✅ تصویر انتخاب شد: " + input.files[0].name;
                label.style.color = "var(--color-up)";
                icon.style.color = "var(--color-up)";
            } else {
                label.innerText = "برای انتخاب تصویر فیش کلیک کنید";
                label.style.color = "var(--text-muted)";
                icon.style.color = "var(--text-muted)";
            }
        }

        // Logic Functions
        async function submitDeposit() {
            const amountInput = document.getElementById('deposit-amount');
            const fileInput = document.getElementById('receipt-file');
            const btn = document.getElementById('btn-submit-dep');
            const amount = parseInt(amountInput.value);

            if(!amount || amount < 50000) { tg.showAlert("حداقل مبلغ واریز ۵۰,۰۰۰ تومان است."); return; }
            if(fileInput.files.length === 0) { tg.showAlert("لطفاً تصویر فیش واریزی را انتخاب کنید."); return; }

            btn.disabled = true; btn.innerText = "در حال آپلود...";

            const formData = new FormData();
            formData.append('initData', tg.initData);
            formData.append('amount', amount);
            formData.append('receipt', fileInput.files[0]);

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/submit_deposit`, { method: 'POST', body: formData });
                let result;
                try { result = await res.json(); } catch { throw new Error("خطای سرور"); }

                if (res.ok && result.status === 'success') {
                    tg.showAlert("✅ " + result.message);
                    closeDepositModal();
                    amountInput.value = ""; fileInput.value = "";
                    document.getElementById('file-label').innerText = "برای انتخاب تصویر کلیک کنید";
                    document.getElementById('up-icon').style.color = "var(--text-muted)";
                    fetchWalletData(); 
                } else {
                    tg.showAlert(`❌ خطا: ${result.message || "ناشناخته"}`);
                }
            } catch (e) { tg.showAlert("خطای ارتباط: " + e.message); } 
            finally { btn.disabled = false; btn.innerText = "تایید و ارسال"; }
        }

        let transactionsData = [];

        window.onload = function() {
            tg.ready(); tg.expand(); tg.setHeaderColor('#000000');
            if (!tg.initData) tg.initData = "query_id=TEST&user=%7B%22id%22%3A111111111%7D&auth_date=1700000000&hash=fake";
            fetchWalletData();
        };

        async function fetchWalletData() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/get_wallet_data`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('balance-toman').innerText = parseInt(data.balances.toman.replace(/,/g, '')).toLocaleString();
                    document.getElementById('balance-uusd').innerText = `$ ${data.balances.uusd}`;
                    transactionsData = data.transactions;
                    renderTx(data.transactions);
                }
            } catch (e) { console.error(e); }
        }

        // Updated Render Function for Luxury UI
        function renderTx(txs) {
            const list = document.getElementById('tx-list');
            list.innerHTML = '';
            if (txs.length === 0) { 
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.8rem">هنوز تراکنشی ثبت نشده است</div>'; 
                return; 
            }

            txs.forEach((tx, index) => {
                const div = document.createElement('div');
                div.className = 'tx-card';
                div.onclick = () => showDetail(index);
                
                let colorClass = '#fff';
                let icon = '';
                
                // Color & Icon Logic
                if(tx.color === 'success') { colorClass = 'var(--color-up)'; icon = '<i class="fas fa-arrow-down" style="color:var(--color-up)"></i>'; }
                else if(tx.color === 'danger') { colorClass = 'var(--color-down)'; icon = '<i class="fas fa-arrow-up" style="color:var(--color-down)"></i>'; }
                else { colorClass = 'var(--gold-primary)'; icon = '<i class="fas fa-exchange-alt" style="color:var(--gold-primary)"></i>'; }

                div.innerHTML = `
                    <div class="tx-left">
                        <div class="tx-icon-box">${icon}</div>
                        <div class="tx-details">
                            <span class="tx-title">${tx.title}</span>
                            <span class="tx-date">${tx.date}</span>
                        </div>
                    </div>
                    <div class="tx-amount" style="color:${colorClass}">${tx.display_amount}</div>
                `;
                list.appendChild(div);
            });
        }

        function showDetail(index) {
            const tx = transactionsData[index];
            const container = document.getElementById('detail-content');
            
            let html = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:10px;">
                    <span style="color:#888; font-size:0.8rem">نوع تراکنش</span>
                    <span style="color:#fff; font-weight:700">${tx.title}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:10px;">
                    <span style="color:#888; font-size:0.8rem">مبلغ</span>
                    <span style="color:#fff; font-weight:700; font-family:monospace; direction:ltr">${tx.display_amount}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:10px;">
                    <span style="color:#888; font-size:0.8rem">تاریخ</span>
                    <span style="color:#fff; font-size:0.9rem">${tx.date}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span style="color:#888; font-size:0.8rem">وضعیت</span>
                    <span style="color:${tx.color === 'success' ? 'var(--color-up)' : (tx.color === 'danger' ? 'var(--color-down)' : 'var(--gold-primary)')}">${tx.status}</span>
                </div>
            `;

            if (tx.type === 'UTOPIA_BUY' && tx.detail) {
                html += `
                    <div class="voucher-display">
                        <div style="color:#888; font-size:0.8rem; margin-bottom:5px;">کد ووچر خریداری شده:</div>
                        <div class="v-code">${tx.detail}</div>
                        <div style="color:var(--color-blue); font-size:0.8rem; margin-top:10px; cursor:pointer;" onclick="navigator.clipboard.writeText('${tx.detail}'); tg.showAlert('کد کپی شد')">
                            <i class="fas fa-copy"></i> کپی کردن کد
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('detail-modal').classList.add('active');
        }
    </script>
</body>
</html>
