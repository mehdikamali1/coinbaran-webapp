<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>مدیریت دارایی | کوین باران</title>
    
    <!-- Libraries -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Styles (Reuse Dashboard V71) -->
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=71.0">

    <style>
        /* --- Wallet Specific Styles --- */
        
        /* دکمه‌های بزرگ عملیات */
        .wallet-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-bottom: 30px;
        }
        .w-btn {
            padding: 20px; border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.03);
        }
        .w-btn:active { transform: scale(0.96); }
        
        .btn-deposit:hover { border-color: var(--accent-green); box-shadow: 0 0 20px rgba(14, 203, 129, 0.1); }
        .btn-deposit i { color: var(--accent-green); font-size: 1.8rem; filter: drop-shadow(0 0 5px rgba(14,203,129,0.5)); }
        .btn-deposit span { color: #fff; font-weight: 700; font-size: 0.95rem; }

        .btn-withdraw:hover { border-color: var(--accent-red); box-shadow: 0 0 20px rgba(246, 70, 93, 0.1); }
        .btn-withdraw i { color: var(--accent-red); font-size: 1.8rem; filter: drop-shadow(0 0 5px rgba(246,70,93,0.5)); }
        .btn-withdraw span { color: #fff; font-weight: 700; font-size: 0.95rem; }

        /* لیست تراکنش‌ها */
        .tx-container { padding-bottom: 80px; }
        .section-label { 
            font-size: 0.95rem; color: var(--text-main); margin-bottom: 15px; 
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::before { content: ''; width: 4px; height: 16px; background: var(--primary-gold); border-radius: 2px; }

        .tx-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; margin-bottom: 12px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            cursor: pointer; transition: all 0.2s;
        }
        .tx-card:active { background: rgba(255, 255, 255, 0.05); transform: translateX(-5px); }

        .tx-left { display: flex; align-items: center; gap: 14px; }
        .tx-icon-box {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
        }
        
        .tx-details { display: flex; flex-direction: column; gap: 4px; }
        .tx-title { font-size: 0.9rem; font-weight: 700; color: #fff; }
        .tx-date { font-size: 0.75rem; color: var(--text-muted); font-family: 'Roboto Mono'; }
        
        .tx-amount { font-family: 'Roboto Mono'; font-weight: 700; font-size: 1rem; direction: ltr; }

        /* باکس آپلود فایل */
        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 30px; text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
            margin-top: 15px;
        }
        .upload-area:active { background: rgba(255,255,255,0.02); border-color: var(--primary-gold); }
        .upload-icon { font-size: 2.5rem; color: var(--text-muted); margin-bottom: 15px; transition: color 0.3s; }
        .upload-label { font-size: 0.85rem; color: var(--text-muted); }

        /* ووچر باکس */
        .voucher-display {
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px;
            border: 1px dashed var(--primary-gold);
            margin-top: 15px; text-align: center;
        }
        .v-code { font-family: 'Roboto Mono'; font-size: 1.1rem; color: var(--primary-gold); letter-spacing: 1px; word-break: break-all; font-weight: bold; }

        /* فیلدهای ورودی مودال */
        .glass-field {
            width: 100%; padding: 16px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 12px; color: #fff; font-size: 1.2rem; font-family: 'Roboto Mono';
            font-weight: bold; text-align: center; outline: none;
        }
        .glass-field:focus { border-color: var(--primary-gold); box-shadow: 0 0 15px rgba(240,185,11,0.1); }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <div class="grid-overlay"></div>

    <!-- Header -->
    <header class="glass-header">
        <div class="profile-section">
            <div class="icon-btn ripple-btn" onclick="window.location.href='/'">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div style="font-weight:800; font-size:1.1rem; color: #fff;">Asset Management</div>
        </div>
        <div class="icon-btn ripple-btn">
            <i class="fas fa-history"></i>
        </div>
    </header>

    <div class="main-scroll-area">
        
        <!-- Platinum Asset Card -->
        <div class="asset-card">
            <div class="card-mesh"></div>
            <div class="card-shine-effect"></div>
            
            <div class="card-top-row">
                <div class="chip-icon"><i class="fas fa-wallet"></i></div>
                <div class="card-brand-text">MAIN WALLET</div>
            </div>

            <div class="balance-display">
                <span class="label-muted">Available Toman Balance</span>
                <div class="amount-row">
                    <h1 id="balance-toman" class="main-digit">---</h1>
                    <span class="currency-symbol">IRT</span>
                </div>
            </div>

            <div class="card-footer-row">
                <div class="stat-item">
                    <span class="stat-label">Game Balance</span>
                    <span class="stat-value color-usd" id="balance-uusd">--- UUSD</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">Status</span>
                    <span class="stat-value color-xp">Active</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="wallet-actions">
            <div class="w-btn btn-deposit ripple-effect" onclick="openDepositModal()">
                <div class="action-icon deposit-theme" style="width:50px; height:50px; background:transparent; border:none;">
                    <i class="fas fa-arrow-down"></i>
                </div>
                <span>Deposit IRT</span>
            </div>
            <div class="w-btn btn-withdraw ripple-effect" onclick="window.location.href='wallet?tab=withdraw'">
                <div class="action-icon withdraw-theme" style="width:50px; height:50px; background:transparent; border:none;">
                    <i class="fas fa-arrow-up"></i>
                </div>
                <span>Withdraw</span>
            </div>
        </div>

        <!-- Transaction List -->
        <div class="tx-container">
            <div class="section-label">Transaction History</div>
            <div id="tx-list">
                <div style="text-align:center; padding:40px; color:var(--text-muted); font-size:0.9rem; opacity: 0.7;">
                    <i class="fas fa-circle-notch fa-spin"></i> Syncing Blockchain Data...
                </div>
            </div>
        </div>

    </div>

    <!-- Deposit Modal (Bottom Sheet Style) -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 style="color:var(--accent-green)">Deposit Funds ⚡️</h3>
                <button onclick="closeDepositModal()" class="close-modal">✕</button>
            </div>
            <div class="modal-body">
                <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">
                    Please enter amount and upload receipt.
                </p>

                <div style="margin-bottom:20px;">
                    <label class="label-muted" style="margin-bottom:8px;">Amount (Toman)</label>
                    <input type="number" id="deposit-amount" class="glass-field" placeholder="e.g. 100,000" inputmode="numeric">
                </div>

                <div class="upload-area ripple-btn" onclick="document.getElementById('receipt-file').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon" id="up-icon"></i>
                    <div class="upload-label" id="file-label">Tap to upload receipt image</div>
                    <input type="file" id="receipt-file" style="display:none" accept="image/*" onchange="updateFileLabel(this)">
                </div>

                <button id="btn-submit-dep" class="btn-confirm-swap ripple-effect" 
                    style="width:100%; margin-top:25px; background:var(--accent-green);" 
                    onclick="submitDeposit()">
                    Submit Request
                </button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>Transaction Details</h3>
                <button onclick="document.getElementById('detail-modal').classList.remove('active')" class="close-modal">✕</button>
            </div>
            <div class="modal-body">
                <div id="detail-content"></div>
                
                <button class="btn-continue" style="margin-top:20px; background:rgba(255,255,255,0.1); color:#fff;" 
                    onclick="document.getElementById('detail-modal').classList.remove('active')">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE_URL = window.location.origin;

        // --- UI Functions ---
        function openDepositModal() { document.getElementById('deposit-modal').classList.add('active'); }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.remove('active'); }
        
        function updateFileLabel(input) {
            const label = document.getElementById('file-label');
            const icon = document.getElementById('up-icon');
            if (input.files && input.files.length > 0) {
                label.innerText = "✅ Selected: " + input.files[0].name;
                label.style.color = "var(--accent-green)";
                icon.style.color = "var(--accent-green)";
                icon.className = "fas fa-check-circle upload-icon";
            } else {
                label.innerText = "Tap to upload receipt image";
                label.style.color = "var(--text-muted)";
                icon.style.color = "var(--text-muted)";
                icon.className = "fas fa-cloud-upload-alt upload-icon";
            }
        }

        // --- Logic ---
        async function submitDeposit() {
            const amountInput = document.getElementById('deposit-amount');
            const fileInput = document.getElementById('receipt-file');
            const btn = document.getElementById('btn-submit-dep');
            const amount = parseInt(amountInput.value);

            if(!amount || amount < 50000) { tg.showAlert("Minimum deposit is 50,000 Toman"); return; }
            if(fileInput.files.length === 0) { tg.showAlert("Please upload the receipt image."); return; }

            btn.disabled = true; btn.innerText = "Uploading...";
            tg.HapticFeedback.impactOccurred('light');

            const formData = new FormData();
            formData.append('initData', tg.initData);
            formData.append('amount', amount);
            formData.append('receipt', fileInput.files[0]);

            try {
                const res = await fetch(`${API_BASE_URL}/webapp/submit_deposit`, { method: 'POST', body: formData });
                let result;
                try { result = await res.json(); } catch { throw new Error("Server Error"); }

                if (res.ok && result.status === 'success') {
                    tg.showAlert("✅ " + result.message);
                    closeDepositModal();
                    amountInput.value = ""; fileInput.value = "";
                    updateFileLabel(fileInput);
                    fetchWalletData(); 
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert(`❌ Error: ${result.message || "Unknown"}`);
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } catch (e) { tg.showAlert("Connection Error: " + e.message); } 
            finally { btn.disabled = false; btn.innerText = "Submit Request"; }
        }

        let transactionsData = [];

        window.onload = function() {
            tg.ready(); tg.expand(); 
            tg.setHeaderColor('#050505');
            tg.setBackgroundColor('#050505');
            
            if (!tg.initData) tg.initData = "query_id=TEST_DEV";
            fetchWalletData();
        };

        async function fetchWalletData() {
            try {
                const res = await fetch(`${API_BASE_URL}/webapp/get_wallet_data`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('balance-toman').innerText = parseInt(data.balances.toman.replace(/,/g, '')).toLocaleString();
                    document.getElementById('balance-uusd').innerText = `${data.balances.uusd} UUSD`;
                    transactionsData = data.transactions;
                    renderTx(data.transactions);
                }
            } catch (e) { console.error(e); }
        }

        function renderTx(txs) {
            const list = document.getElementById('tx-list');
            list.innerHTML = '';
            if (txs.length === 0) { 
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.8rem">No transactions found</div>'; 
                return; 
            }

            txs.forEach((tx, index) => {
                const div = document.createElement('div');
                div.className = 'tx-card ripple-btn';
                div.onclick = () => { showDetail(index); tg.HapticFeedback.selectionChanged(); };
                
                let colorClass = '#fff';
                let icon = '';
                
                if(tx.color === 'success') { 
                    colorClass = 'var(--accent-green)'; 
                    icon = '<i class="fas fa-arrow-down" style="color:var(--accent-green)"></i>'; 
                }
                else if(tx.color === 'danger') { 
                    colorClass = 'var(--accent-red)'; 
                    icon = '<i class="fas fa-arrow-up" style="color:var(--accent-red)"></i>'; 
                }
                else { 
                    colorClass = 'var(--primary-gold)'; 
                    icon = '<i class="fas fa-exchange-alt" style="color:var(--primary-gold)"></i>'; 
                }

                div.innerHTML = `
                    <div class="tx-left">
                        <div class="tx-icon-box">${icon}</div>
                        <div class="tx-details">
                            <span class="tx-title">${tx.title}</span>
                            <span class="tx-date">${tx.date}</span>
                        </div>
                    </div>
                    <div class="tx-amount" style="color:${colorClass}">${tx.display_amount}</div>
                `;
                list.appendChild(div);
            });
        }

        function showDetail(index) {
            const tx = transactionsData[index];
            const container = document.getElementById('detail-content');
            
            let statusColor = tx.color === 'success' ? 'var(--accent-green)' : (tx.color === 'danger' ? 'var(--accent-red)' : 'var(--primary-gold)');

            let html = `
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
                    <span style="color:var(--text-muted); font-size:0.9rem">Type</span>
                    <span style="color:#fff; font-weight:700">${tx.title}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
                    <span style="color:var(--text-muted); font-size:0.9rem">Amount</span>
                    <span style="color:#fff; font-weight:700; font-family:'Roboto Mono'; direction:ltr">${tx.display_amount}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
                    <span style="color:var(--text-muted); font-size:0.9rem">Date</span>
                    <span style="color:#fff; font-size:0.9rem; font-family:'Roboto Mono'">${tx.date}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span style="color:var(--text-muted); font-size:0.9rem">Status</span>
                    <span style="color:${statusColor}; font-weight:bold">${tx.status}</span>
                </div>
            `;

            if (tx.type === 'UTOPIA_BUY' && tx.detail) {
                html += `
                    <div class="voucher-display">
                        <div style="color:var(--text-muted); font-size:0.8rem; margin-bottom:8px;">Purchased Voucher Code:</div>
                        <div class="v-code">${tx.detail}</div>
                        <div class="ripple-btn" style="color:var(--accent-blue); font-size:0.85rem; margin-top:12px; cursor:pointer; padding:5px;" 
                             onclick="navigator.clipboard.writeText('${tx.detail}'); tg.showAlert('Code Copied!'); tg.HapticFeedback.notificationOccurred('success');">
                            <i class="fas fa-copy"></i> Copy Code
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('detail-modal').classList.add('active');
        }
    </script>
</body>
</html>
