<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIP Wallet | Coin Baran</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="webapp/dashboard-style.css?v=85">
    <link rel="stylesheet" href="webapp/wallet-style.css?v=85">
</head>
<body>
    <div id="loader">
        <img src="webapp/images/logo-gold.png" width="80" style="animation: pulse 2s infinite;">
    </div>

    <div id="app-container" class="hidden-content">
        <div class="asset-card luxe-card">
            <div class="card-shine"></div>
            <div class="balance-row">
                <span class="label-muted">موجودی کل دارایی</span>
                <button class="privacy-btn" onclick="togglePrivacy()"><i id="privacy-icon" class="fas fa-eye"></i></button>
            </div>
            <div class="amount-row" style="margin: 15px 0;">
                <h1 id="balance-toman" class="main-digit counter">0</h1>
                <span class="currency-symbol">تومان</span>
            </div>
            <div class="card-footer-row">
                <div class="stat-item">
                    <span class="stat-label">موجودی تتر</span>
                    <span class="stat-value color-usd" id="balance-uusd">0.00 USDT</span>
                </div>
                <div class="stat-item" style="text-align: left;">
                    <span class="stat-label">امنیت حساب</span>
                    <span class="stat-value" style="color:var(--green)">High Security</span>
                </div>
            </div>
        </div>

        <div class="wallet-actions">
            <div class="w-btn" onclick="openDepositModal()">
                <i class="fas fa-arrow-down-to-bracket" style="color:var(--green)"></i>
                <span>واریز وجه</span>
            </div>
            <div class="w-btn" onclick="tg.showAlert('بخش برداشت در حال به‌روزرسانی نهایی است.')">
                <i class="fas fa-arrow-up-from-bracket" style="color:var(--red)"></i>
                <span>برداشت</span>
            </div>
        </div>

        <div class="tx-container">
            <div class="section-label">تراکنش‌های اخیر</div>
            <div id="tx-list"></div>
        </div>
    </div>

    <div id="receipt-sheet" class="receipt-sheet">
        <div style="width:40px; height:4px; background:#333; margin:0 auto 25px; border-radius:10px;"></div>
        <h3 id="rcp-title" style="text-align:center; margin-bottom:20px;">جزئیات</h3>
        <div style="background:rgba(255,255,255,0.02); border-radius:20px; padding:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <span style="color:#666;">مبلغ تراکنش:</span><span id="rcp-amount" style="font-weight:bold;">-</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <span style="color:#666;">زمان ثبت:</span><span id="rcp-date">-</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:#666;">وضعیت:</span><span id="rcp-status" style="color:var(--green);">تایید شده</span>
            </div>
        </div>
        <button class="btn-confirm-swap" style="background:#222; color:#fff; margin-top:20px;" onclick="closeReceipt()">بستن رسید</button>
    </div>

    <script src="webapp/wallet-engine.js?v=85"></script>
    <script>
        // اضافه کردن منطق رندر لیست تراکنش‌ها به موتور اصلی
        // کد قبلی fetchWalletData را اینجا قرار می‌دهیم با تغییر کوچک در رندر
        async function fetchWalletData() {
            try {
                const res = await fetch(`${API_BASE}/get_user_data`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    const balance = parseInt(data.toman_balance.replace(/,/g, ''));
                    animateValue(document.getElementById('balance-toman'), 0, balance, 1500);
                    document.getElementById('balance-uusd').innerText = data.uusd_balance + " USDT";
                    TX_DATA = data.transactions;
                    renderLuxeList(data.transactions);
                    hideLoader();
                    initParallax();
                }
            } catch(e) { console.error(e); hideLoader(); }
        }

        function renderLuxeList(txs) {
            const list = document.getElementById('tx-list');
            list.innerHTML = txs.map((tx, idx) => `
                <div class="tx-card" onclick="showReceipt(${idx})">
                    <div class="tx-left">
                        <div class="tx-icon-luxe ${tx.color === 'success' ? 'tx-up' : 'tx-down'}">
                            <i class="fas ${tx.color === 'success' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div class="tx-details">
                            <span class="tx-title">${tx.title}</span>
                            <span class="tx-date">${tx.date}</span>
                        </div>
                    </div>
                    <div class="tx-amount" style="color:var(--${tx.color === 'success' ? 'green' : 'red'})">${tx.display_amount}</div>
                </div>
            `).join('');
        }
        fetchWalletData();
    </script>
</body>
</html>
